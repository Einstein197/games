<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click the Coin – Krypton Arcade</title>

  <style>
    body {
      margin: 0;
      background: #050509;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      height: auto;

    }

    h1 { margin: 16px 0 4px; }
    p { margin: 0 0 10px; font-size: 14px; opacity: 0.8; }

    #coinScore {
      font-size: 20px;
      font-weight: 600;
      color: #ff7b00;
      margin-bottom: 6px;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #ff7b00;
      color: #050509;
      font-weight: 600;
      cursor: pointer;
    }

    #coinArea {
      position: relative;
      width: 260px;
      height: 120px;
      margin-top: 16px;
      border-radius: 12px;
      background: #111;
      border: 2px solid #333;
      overflow: hidden;
    }

    #coin {
      position: absolute;
      width: 40px;
      height: 40px;
      background: rgb(255, 0, 60);
      border-radius: 50%;
      display: none;
      box-shadow: 0 0 10px rgba(255,215,0,0.7);
      cursor: pointer;
    }

    
  </style>
</head>
<body>

  <h1>Click the Coin</h1>
  <p>Tap “Start” then tap the coin as many times as you can in 10 seconds.</p>

  <div id="coinScore">Score: 0</div>

  <button onclick="startCoinGame()">Start</button>

  <div id="coinArea">
    <img id="coin" src="krypton.png">
  </div>

  <script>

    const kryptonImg = new Image();
    kryptonImg.src = "krypton.png";
  


    /* PLAYER NAME */
    if (!localStorage.getItem("playerID")) {
      const id = "player_" + Math.random().toString(16).slice(2, 8).toUpperCase();
      localStorage.setItem("playerID", id);
    }
    if (!localStorage.getItem("playerName")) {
      localStorage.setItem("playerName", localStorage.getItem("playerID"));
    }

    /* GAME VARS */
    let coinScore = 0;
    let coinTime = 10;
    let coinInterval;

    const coin = document.getElementById("coin");
    const coinScoreEl = document.getElementById("coinScore");
    const coinArea = document.getElementById("coinArea");

    function updateCoinScore() {
      coinScoreEl.textContent = "Score: " + coinScore;
    }

    function startCoinGame() {
      coinScore = 0;
      coinTime = 10;
      updateCoinScore();

      coin.style.display = "block";
      moveCoin();

      clearInterval(coinInterval);
      coinInterval = setInterval(() => {
        coinTime--;
        if (coinTime <= 0) {
          clearInterval(coinInterval);
          coin.style.display = "none";
          alert("Time's up! Your score: " + coinScore);
          submitCoinScore(coinScore);
        }
      }, 1000);
    }

    function moveCoin() {
      const areaRect = coinArea.getBoundingClientRect();
      const maxX = areaRect.width - 40;
      const maxY = areaRect.height - 40;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      coin.style.left = x + "px";
      coin.style.top = y + "px";
    }

    function hitCoin(e) {
      e.preventDefault();
      coinScore++;
      updateCoinScore();
      moveCoin();
    }

    coin.addEventListener("click", hitCoin);
    coin.addEventListener("touchstart", hitCoin, { passive: false });

    /* SUBMIT SCORE TO CLOUDFLARE */
    async function submitCoinScore(score) {
      try {
        await fetch("https://leaderboard.shadownetcg-f2f.workers.dev/submit?game=coin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: localStorage.getItem("playerName"),
            score: score
          })
        });
      } catch (err) {
        console.log("Score upload failed:", err);
      }
    }

    function sendHeight() {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: "resize-iframe", height }, "*");
    }

    window.onload = sendHeight;
    setInterval(sendHeight, 300);
  </script>

</body>
</html>
