<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter – Krypton Arcade</title>

  <style>
    body {
      margin: 0;
      background: #050509;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 16px 0 4px; }
    p { margin: 0 0 10px; font-size: 14px; opacity: 0.8; }

    #spaceScore {
      font-size: 18px;
      font-weight: 600;
      color: #ff7b00;
      margin-bottom: 4px;
      display: none;
    }

    #spaceLives {
      font-size: 20px;
      margin-bottom: 4px;
      display: none;
    }

    #spaceHealth {
      font-size: 16px;
      font-weight: 600;
      color: #ff7b00;
      margin-bottom: 10px;
      display: none;
    }

    canvas {
      background: radial-gradient(circle at top, #222 0, #050509 60%);
      border: 2px solid #333;
      margin-top: 10px;
      width: 90vw;
      max-width: 320px;
      height: auto;
      touch-action: none;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>Space Shooter</h1>
  <p>Dodge debris, fight enemy ships, collect power-ups. check comments</p>

  <div id="spaceScore">Score: 0</div>
  <div id="spaceLives">❤️❤️❤️</div>
  <div id="spaceHealth">Health: 100</div>

  <canvas id="spaceCanvas" width="240" height="320"></canvas>

  <script>
    /* PLAYER ID + NAME */
    if (!localStorage.getItem("playerID")) {
      const id = "player_" + Math.random().toString(16).slice(2, 8).toUpperCase();
      localStorage.setItem("playerID", id);
    }
    if (!localStorage.getItem("playerName")) {
      localStorage.setItem("playerName", localStorage.getItem("playerID"));
    }

    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");

    canvas.addEventListener("click", handleGameTap);
    canvas.addEventListener("touchstart", handleGameTap);

    let ship, bullets, enemies, stars, powerups, debris, enemyBullets;
    let spaceScore = 0;
    let lives = 3;
    let health = 100;
    let running = false;
    let lastTime = 0;
    let shootCooldown = 0;
    let difficulty = 1;
    let gameRunning = false;
    let gamePaused = false;
    let gameLoopId = null;
    let lastTap = 0;
    let wave = 1;
    let enemiesToSpawn = 0;
    let enemiesAlive = 0;
    let waveState = "spawning"; 
    // states: "spawning" | "clearing" | "cooldown"
    let waveCooldown = 0;
    let enemiesPerWave = 1;
    let waitingForNextWave = false;
    let patternTime = 0;
    // TEST MODE
    let TEST_MODE = false;
    let testIntervals = [];

    // BOOSTERS
    let power = {
      rapid: 0,
      multishot: 1,
      shieldTime: 0
    };

    // Powerup images
    const shieldImg = new Image();
    shieldImg.src = "shield.png";
    const rapidImg = new Image();
    rapidImg.src = "rapid.png";
    const doubleImg = new Image();
    doubleImg.src = "double.png";
    const lifeImg = new Image();
    lifeImg.src = "life.png";

    function updateLives() {
      document.getElementById("spaceLives").textContent = "❤️".repeat(lives);
    }

    function updateHealth() {
      document.getElementById("spaceHealth").textContent = "Health: " + Math.floor(health);
    }

    function updateSpaceScore() {
      document.getElementById("spaceScore").textContent = "Score: " + spaceScore;
    }

    function resetSpaceGame() {
      shootCooldown = 0;
      wave = 1;
      enemiesPerWave = 1;
      waitingForNextWave = false;
      waveCooldown = 0;
      difficulty = 1;

      ship = {
        x: canvas.width / 2 - 12,
        y: canvas.height - 40,
        w: 24,
        h: 24,
        speed: 4,
        invincible: 0
      };

      bullets = [];
      enemies = [];
      stars = [];
      powerups = [];
      debris = [];
      enemyBullets = [];

      spaceScore = 0;
      lives = 3;
      health = 100;

      power = { rapid: 0, multishot: 1, shieldTime: 0 };

      updateLives();
      updateHealth();
      updateSpaceScore();

      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          s: Math.random() * 1.5 + 0.5
        });
      }
    }

    // ---------- TEST MODE ----------
    function enableTestMode() {
      TEST_MODE = true;

      lives = 999;
      health = 999;
      power.shieldTime = 999999;

      power.rapid = 5;
      power.multishot = 10;

      testIntervals.push(setInterval(() => {
        powerups.push({
          x: Math.random() * (canvas.width - 12),
          y: -20,
          w: 12,
          h: 12,
          type: ["shield", "rapid", "double", "life"][Math.floor(Math.random() * 4)]
        });
      }, 300));

      testIntervals.push(setInterval(() => {
        spawnEnemy();
      }, 500));

      testIntervals.push(setInterval(() => {
        spawnBoss();
      }, 8000));

      console.log("TEST MODE ENABLED");
    }

    function disableTestMode() {
      TEST_MODE = false;

      testIntervals.forEach(id => clearInterval(id));
      testIntervals = [];

      power.rapid = 0;
      power.multishot = 1;
      power.shieldTime = 0;
      lives = 3;
      health = 100;

      console.log("TEST MODE DISABLED");
    }

    function toggleTestMode() {
      if (TEST_MODE) disableTestMode();
      else enableTestMode();
    }

    document.addEventListener("keydown", e => {
      if (e.key === "t" || e.key === "T") {
        toggleTestMode();
      }
    });

    // ---------- ENEMY SPAWNING ----------

    function spawnEnemy(typeOverride = null) {
      const typeRoll = Math.random();
      let type = typeOverride;

      if (!type) {
        if (typeRoll < 0.55) type = "light";
        else if (typeRoll < 0.9) type = "medium";
        else type = "elite";
      }

      let baseHP, speedX, w, h;

      if (type === "light") {
        baseHP = 1;
        speedX = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random());
        w = 16; h = 16;
      } else if (type === "medium") {
        baseHP = 3;
        speedX = (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.5);
        w = 22; h = 22;
      } else if (type === "elite") {
        baseHP = 6;
        speedX = (Math.random() < 0.5 ? -1 : 1) * 1.5;
        w = 26; h = 26;
      } else if (["dreadnought", "hive", "mecha"].includes(type)) {
        baseHP = 200 + wave * 40;
        speedX = 1.2;
        w = 80; h = 60;
      }

      const hpMultiplier = 1 + wave * 0.25;

      const enemy = {
        type,
        x: Math.random() * (canvas.width - w),
        y: Math.random() * 60 + 20,
        w,
        h,
        speedX,
        hoverOffset: Math.random() * 200,
        hoverSpeed: 0.01 + Math.random() * 0.03,
        hp: ["dreadnought", "hive", "mecha"].includes(type)
          ? baseHP
          : Math.floor(baseHP * hpMultiplier),
        maxHP: ["dreadnought", "hive", "mecha"].includes(type)
          ? baseHP
          : Math.floor(baseHP * hpMultiplier),
        dive: false,
        phase: 1,
        cooldown: 0
      };

      enemies.push(enemy);
      return enemy;
    }

    function spawnEnemyAt(x, y, typeOverride = null) {
      spawnEnemy(typeOverride);
      const e = enemies[enemies.length - 1];
      e.x = x;
      e.y = y;
    }

    function spawnFormation(count) {
      const formation = Math.floor(Math.random() * 4);

      if (formation === 0) {
        for (let i = 0; i < count; i++) {
          spawnEnemyAt(20 + i * 30, 30);
        }
      } else if (formation === 1) {
        for (let i = 0; i < count; i++) {
          const offset = i - count / 2;
          spawnEnemyAt(
            canvas.width / 2 + offset * 20,
            20 + Math.abs(offset) * 10
          );
        }
      } else if (formation === 2) {
        for (let i = 0; i < count; i++) {
          spawnEnemyAt(
            (i + 0.5) * (canvas.width / count),
            20 + Math.sin(i) * 20
          );
        }
      } else if (formation === 3) {
        for (let i = 0; i < count; i++) {
          const col = i % 2 === 0 ? 40 : canvas.width - 40;
          spawnEnemyAt(col, 20 + i * 15);
        }
      }
    }

    function spawnBoss() {
      const bossTypes = ["dreadnought", "hive", "mecha"];
      const pick = bossTypes[Math.floor(Math.random() * bossTypes.length)];

      const boss = {
        type: pick,
        x: canvas.width / 2 - 40,
        y: 40,
        w: 80,
        h: 60,
        hp: 200 + wave * 40,
        maxHP: 200 + wave * 40,
        phase: 1,
        cooldown: 0,
        speedX: 1.2
      };

      enemies.push(boss);
    }

    function startWave() {

      waveState = "clearing";

      if (wave % 5 === 0) {
        spawnBoss();
        enemiesToSpawn = 1;
        return;
      }

      let base = 2 + wave;
      let bonus = Math.floor(Math.random() * 3);

      enemiesToSpawn = Math.min(12, base + bonus);

      spawnFormation(enemiesToSpawn);
    }

    function updateWaves(dt) {

      // If wave not started yet, start it
      if (waveState === "spawning") {
        if (enemiesToSpawn === 0) {
          startWave();
        }
      }

      // Detect enemies killed in real time (NOT array length)
      enemiesAlive = enemies.filter(e => e && e.hp > 0).length;

      // Wave completed condition
      if (waveState === "clearing" && enemiesAlive === 0) {
        waveState = "cooldown";
        waveCooldown = 1800; // 1.8 sec break between waves
      }

      // Handle cooldown
      if (waveState === "cooldown") {
        waveCooldown -= dt * 16.67;

        if (waveCooldown <= 0) {
          wave++;
          waveState = "spawning";
          enemiesToSpawn = 0; // triggers next wave
        }
      }
    }
    // ---------- SHOOTING ----------
    function shoot() {
      if (!running) return;
      if (shootCooldown > 0) return;

      let shots = power.multishot;

      for (let i = 0; i < shots; i++) {
        let angle;
        if (shots === 1) {
          angle = 0;
        } else {
          let t = (i - (shots - 1) / 2) / ((shots - 1) / 2);
          angle = t * Math.abs(t) * 0.08;
        }

        bullets.push({
          x: ship.x + ship.w / 2,
          y: ship.y,
          w: 4,
          h: 8,
          speedX: Math.sin(angle) * 4,
          speedY: -Math.cos(angle) * 4
        });
      }

      // ⭐ Stacking rapid-fire fix
      shootCooldown = Math.max(2, 10 - power.rapid * 2);
    }

    // ---------- DAMAGE ----------
    function damage(amount) {
      if (ship.invincible > 0) return false;

      if (power.shieldTime > 0) {
        power.shieldTime -= 1000;
        if (power.shieldTime < 0) power.shieldTime = 0;
        return false;
      }

      health -= amount;
      updateHealth();

      if (health <= 0) {
        lives--;
        updateLives();

        if (lives <= 0) {
          endSpaceGame();
          return true;
        }

        health = 100;
        updateHealth();
      }

      ship.invincible = 40;
      return false;
    }

    // ---------- GAME LOOP ----------
    function startSpaceGame() {
      shootCooldown = 0;
      resetSpaceGame();
      running = true;
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(spaceLoop);
    }

    function spaceLoop(ts) {
      if (gamePaused || !running) return;

      const dt = (ts - lastTime) / 16.67;
      lastTime = ts;
      patternTime += dt;

      updateSpace(dt);
      drawSpace();

      gameLoopId = requestAnimationFrame(spaceLoop);
    }

    function pauseGame() {
      gamePaused = true;
      cancelAnimationFrame(gameLoopId);
    }

    function resumeGame() {
      if (!running) return;
      gamePaused = false;
      lastTime = performance.now();
      requestAnimationFrame(spaceLoop);
    }

    function handleGameTap(e) {
      e.preventDefault();
      const now = Date.now();

      if (!gameRunning) {
        gameRunning = true;
        gamePaused = false;
        startSpaceGame();
        lastTap = now;
        return;
      }

      if (now - lastTap < 300) {
        if (!gamePaused) pauseGame(); else resumeGame();
      }

      lastTap = now;
    }

    // ---------- ENEMY BULLET PATTERNS ----------
    function fireBossCircle(e) {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      const count = 14;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i;
        enemyBullets.push({
          x: cx,
          y: cy,
          w: 4,
          h: 4,
          speedX: Math.cos(angle) * 2,
          speedY: Math.sin(angle) * 2
        });
      }
    }

    function fireBossCone(e) {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h;
      for (let i = -3; i <= 3; i++) {
        enemyBullets.push({
          x: cx,
          y: cy,
          w: 4,
          h: 4,
          speedX: i * 0.7,
          speedY: 2.2
        });
      }
    }

    function fireBossSpiral(e) {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      const angle = patternTime * 0.15;
      enemyBullets.push({
        x: cx,
        y: cy,
        w: 4,
        h: 4,
        speedX: Math.cos(angle) * 2.5,
        speedY: Math.sin(angle) * 2.5
      });
    }

    function fireEliteAimed(e) {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h;
      const targetX = ship.x + ship.w / 2;
      const targetY = ship.y;
      const dx = targetX - cx;
      const dy = targetY - cy;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const speed = 2.4;
      enemyBullets.push({
        x: cx,
        y: cy,
        w: 4,
        h: 8,
        speedX: (dx / len) * speed,
        speedY: (dy / len) * speed
      });
    }

    // ---------- UPDATE LOOP ----------
    function isBossType(e) {
      return ["dreadnought", "hive", "mecha"].includes(e.type);
    }

    function updateSpace(dt) {
      dt = Math.min(dt, 2.5);
      shootCooldown = Math.max(0, shootCooldown - dt * 0.2);
      updateWaves(dt);

      shoot();
      difficulty += 0.00015 * dt;

      if (ship.invincible > 0) ship.invincible -= dt;

      // ---------- STARS ----------
      stars.forEach(s => {
        s.y += s.s * dt;
        if (s.y > canvas.height) {
          s.y = -2;
          s.x = Math.random() * canvas.width;
        }
      });

      // ---------- ENEMY MOVEMENT & AI ----------
      enemies.forEach(e => {
        if (isBossType(e)) {
          const shipCenter = ship.x + ship.w / 2;
          const bossCenter = e.x + e.w / 2;
          if (shipCenter < bossCenter) e.x -= 0.8 * dt;
          else e.x += 0.8 * dt;

          if (e.x < 0) e.x = 0;
          if (e.x + e.w > canvas.width) e.x = canvas.width - e.w;

          const ratio = e.hp / e.maxHP;
          if (ratio < 0.6) e.phase = 2;
          if (ratio < 0.3) e.phase = 3;

          if (Math.random() < 0.01 * dt) fireBossCircle(e);
          if (e.phase >= 2 && Math.random() < 0.008 * dt) fireBossCone(e);
          if (e.phase >= 3 && Math.random() < 0.02 * dt) fireBossSpiral(e);

        } else {
  
          e.x += e.speedX * dt;

          const margin = 10;

          // LEFT WALL
          if (e.x <= margin) {
            e.x = margin;

            // bounce RIGHT
            e.speedX = Math.abs(e.speedX);

            // anti-freeze safeguard
            if (e.speedX < 0.8) {
              e.speedX = 0.8 + Math.random();
            }
          }

          // RIGHT WALL
          if (e.x + e.w >= canvas.width - margin) {
            e.x = canvas.width - e.w - margin;

            // bounce LEFT
            e.speedX = -Math.abs(e.speedX);

            // anti-freeze safeguard
            if (Math.abs(e.speedX) < 0.8) {
              e.speedX = -(0.8 + Math.random());
            }
          }

          // FINAL SAFETY CLAMP
          e.x = Math.max(
            margin,
            Math.min(canvas.width - e.w - margin, e.x)
          );

          e.y += Math.sin(
            performance.now() * e.hoverSpeed + e.hoverOffset
          ) * 0.3;



          const maxEnemyY = ship.y - 80;
          if (e.y > maxEnemyY) e.y = maxEnemyY;

          if (e.type === "elite") {
            if (Math.random() < 0.0008 * dt && !e.dive) {
              e.dive = true;
            }
            if (e.dive) {
              e.y += 2.5 * dt;
              if (e.y > ship.y - 40) e.dive = false;
            }

            if (Math.random() < 0.002 * dt) {
              if (ship.x < e.x) e.x -= 1.2 * dt;
              else e.x += 1.2 * dt;
            }
          }
        }
      });

      // ---------- SHIELD TIMER ----------
      if (power.shieldTime > 0) {
        power.shieldTime -= dt * 16.67;
        if (power.shieldTime < 0) power.shieldTime = 0;
      }

      // ---------- DEBRIS ----------
      if (Math.random() < 0.003 * dt) {
        debris.push({
          x: Math.random() * (canvas.width - 10),
          y: -20,
          w: 10,
          h: 10,
          speed: 0.6 + Math.random() * 0.4
        });
      }
      debris.forEach(d => d.y += d.speed * dt);
      debris = debris.filter(d => d.y < canvas.height + 20);

      // ---------- PLAYER BULLETS ----------
      bullets.forEach(b => {
        b.x += b.speedX * dt;
        b.y += b.speedY * dt;
      });
      bullets = bullets.filter(b => b.y + b.h > 0);

      // ---------- POWERUP SPAWNING ----------
      const SPAWN_RATE = 0.0018;
      const SPEED = 1.2;
      const MAX_ON_SCREEN = 2;

      if (powerups.length < MAX_ON_SCREEN && Math.random() < SPAWN_RATE * dt) {
        const roll = Math.random();
        let type;
        if (roll < 0.40) type = "shield";
        else if (roll < 0.75) type = "rapid";
        else if (roll < 0.90) type = "double";
        else type = "life";

        powerups.push({
          x: Math.random() * (canvas.width - 12),
          y: -20,
          w: 12,
          h: 12,
          type: type
        });
      }

      powerups.forEach(p => p.y += SPEED * dt);
      powerups = powerups.filter(p => p.y < canvas.height + 20);

      // ---------- ENEMY BULLETS ----------
      enemies.forEach(e => {
        if (isBossType(e)) {
          // handled above
        } else if (e.type === "elite") {
          if (Math.random() < 0.005 * dt) {
            fireEliteAimed(e);
          }
        } else {
          if (Math.random() < 0.003 * dt) {
            enemyBullets.push({
              x: e.x + e.w / 2 - 2,
              y: e.y + e.h,
              w: 4,
              h: 8,
              speedX: 0,
              speedY: 2
            });
          }
        }
      });

      enemyBullets.forEach(b => {
        b.x += (b.speedX || 0) * dt;
        b.y += (b.speedY || b.speed || 0) * dt;
      });
      enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

      // ---------- BULLET VS ENEMY ----------
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
          const e = enemies[ei];
          if (
            b.x < e.x + e.w &&
            b.x + b.w > e.x &&
            b.y < e.y + e.h &&
            b.y + b.h > e.y
          ) {
            bullets.splice(bi, 1);
            e.hp--;

            if (e.hp <= 0) {
              if (isBossType(e)) {
                spaceScore += 200;
              } else if (e.type === "elite") {
                spaceScore += 40;
              } else {
                spaceScore += 10;
              }
              enemies.splice(ei, 1);
              updateSpaceScore();
            }
            break;
          }
        }
      }

      // ---------- POWERUP PICKUP ----------
      powerups.forEach((p, i) => {
        if (
          p.x < ship.x + ship.w &&
          p.x + p.w > ship.x &&
          p.y < ship.y + ship.h &&
          p.y + p.h > ship.y
        ) {
          if (p.type === "shield") {
            power.shieldTime += 10000;
          }
          if (p.type === "rapid") {
            power.rapid++;
          }
          if (p.type === "double") {
            power.multishot = Math.min(10, power.multishot + 1);
          }
          if (p.type === "life") {
            lives++;
            updateLives();
          }
          powerups.splice(i, 1);
        }
      });

      // ---------- ENEMY BULLET VS SHIP ----------
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (
          b.x < ship.x + ship.w &&
          b.x + b.w > ship.x &&
          b.y < ship.y + ship.h &&
          b.y + b.h > ship.y
        ) {
          enemyBullets.splice(i, 1);
          if (damage(20)) return;
        }
      }

      // ---------- DEBRIS VS SHIP ----------
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        if (
          d.x < ship.x + ship.w &&
          d.x + d.w > ship.x &&
          d.y < ship.y + ship.h &&
          d.y + d.h > ship.y
        ) {
          debris.splice(i, 1);
          if (damage(15)) return;
        }
      }

      // ---------- ENEMY BODY VS SHIP ----------
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        if (
          e.x < ship.x + ship.w &&
          e.x + e.w > ship.x &&
          e.y < ship.y + ship.h &&
          e.y + e.h > ship.y
        ) {
          enemies.splice(i, 1);
          if (damage(35)) return;
        }
      }

      // ---------- HARD SAFETY CLEANUP ----------
      enemies = enemies.filter(e => {

        if (!e) return false;
        if (e.hp <= 0) return false;

        // MUCH tighter bounds
        if (e.x < -80) return false;
        if (e.x > canvas.width + 80) return false;
        if (e.y < -80) return false;
        if (e.y > canvas.height + 120) return false;

        return true;
      });
    }
    // ---------- DRAWING ----------

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x + ship.w / 2, ship.y + ship.h / 2);

      if (ship.invincible > 0 && Math.floor(ship.invincible) % 2 === 0) {
        ctx.restore();
        return;
      }

      ctx.fillStyle = "#4fd5ff";
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(14, 12);
      ctx.lineTo(0, 8);
      ctx.lineTo(-14, 12);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#00ffa8";
      ctx.beginPath();
      ctx.ellipse(0, -4, 6, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 180, 0, 0.9)";
      ctx.beginPath();
      ctx.moveTo(-5, 12);
      ctx.lineTo(0, 20);
      ctx.lineTo(5, 12);
      ctx.closePath();
      ctx.fill();

      if (power.shieldTime > 0) {
        ctx.strokeStyle = "rgba(0, 200, 255, 0.7)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.font = "10px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(Math.ceil(power.shieldTime / 1000), 0, -28);
      }

      ctx.restore();
    }

    // ---------- BOSS DRAWING ----------

    function drawBoss_Dreadnought(e) {
      ctx.save();
      ctx.translate(e.x + e.w/2, e.y + e.h/2);

      ctx.fillStyle = "#3a0f0f";
      ctx.beginPath();
      ctx.moveTo(-40, -20);
      ctx.lineTo(40, -20);
      ctx.lineTo(55, 0);
      ctx.lineTo(40, 20);
      ctx.lineTo(-40, 20);
      ctx.lineTo(-55, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#661111";
      ctx.fillRect(-30, -12, 60, 24);

      ctx.fillStyle = "#ff4444";
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff8800";
      ctx.beginPath();
      ctx.arc(-35, 0, 8, 0, Math.PI * 2);
      ctx.arc(35, 0, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawBoss_Hive(e) {
      ctx.save();
      ctx.translate(e.x + e.w/2, e.y + e.h/2);

      ctx.fillStyle = "#4b0f5f";
      ctx.beginPath();
      ctx.ellipse(0, 0, 45, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#7a1fa3";
      ctx.beginPath();
      ctx.ellipse(0, 0, 30, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff00ff";
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#aa33ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-40, -10);
      ctx.quadraticCurveTo(-60, 0, -40, 10);
      ctx.moveTo(40, -10);
      ctx.quadraticCurveTo(60, 0, 40, 10);
      ctx.stroke();

      ctx.restore();
    }

    function drawBoss_Mecha(e) {
      ctx.save();
      ctx.translate(e.x + e.w/2, e.y + e.h/2);

      ctx.fillStyle = "#1e2b3c";
      ctx.beginPath();
      ctx.moveTo(0, -35);
      ctx.lineTo(35, -10);
      ctx.lineTo(25, 30);
      ctx.lineTo(-25, 30);
      ctx.lineTo(-35, -10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#00d4ff";
      ctx.beginPath();
      ctx.ellipse(0, -10, 12, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff4444";
      ctx.fillRect(-40, -20, 12, 20);
      ctx.fillRect(28, -20, 12, 20);

      ctx.fillStyle = "#ffaa00";
      ctx.beginPath();
      ctx.arc(-15, 32, 8, 0, Math.PI * 2);
      ctx.arc(15, 32, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawBossHP(e) {
      const barWidth = e.w;
      const barHeight = 4;
      const x = e.x;
      const y = e.y - 8;
      const ratio = e.hp / e.maxHP;

      ctx.fillStyle = "#400";
      ctx.fillRect(x, y, barWidth, barHeight);
      ctx.fillStyle = "#f44";
      ctx.fillRect(x, y, barWidth * ratio, barHeight);
    }

    // ---------- ENEMY DRAWING ----------

    function drawEnemyShip(e) {
      if (e.type === "dreadnought") {
        drawBoss_Dreadnought(e);
        drawBossHP(e);
        return;
      }
      if (e.type === "hive") {
        drawBoss_Hive(e);
        drawBossHP(e);
        return;
      }
      if (e.type === "mecha") {
        drawBoss_Mecha(e);
        drawBossHP(e);
        return;
      }

      ctx.save();
      ctx.translate(e.x + e.w / 2, e.y + e.h / 2);

      if (e.type === "elite") {
        ctx.fillStyle = "#ff4b81";
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.lineTo(16, -10);
        ctx.lineTo(0, -6);
        ctx.lineTo(-16, -10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ffd1e0";
        ctx.beginPath();
        ctx.ellipse(0, 4, 6, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        return;
      }

      ctx.fillStyle = "#ff4b81";
      ctx.beginPath();
      ctx.moveTo(0, 14);
      ctx.lineTo(14, -12);
      ctx.lineTo(0, -8);
      ctx.lineTo(-14, -12);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffd1e0";
      ctx.beginPath();
      ctx.ellipse(0, 4, 6, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---------- POWERUP DRAWING ----------
    function drawImagePowerup(x, y, img) {
      ctx.drawImage(img, x - 12, y - 12, 24, 24);
    }

    // ---------- UI DRAWING ----------
    function drawUI() {
      ctx.save();
      ctx.fillStyle = "white";
      ctx.font = "12px system-ui";
      ctx.textAlign = "left";

      ctx.fillText("Score: " + spaceScore, 10, 14);
      ctx.fillText("Health: " + Math.floor(health), 10, 28);
      ctx.fillText("❤️".repeat(lives), 10, 42);

      ctx.restore();
    }

    // ---------- MAIN DRAW ----------
    function drawSpace() {
      ctx.fillStyle = "#050509";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(s => {
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fillRect(s.x, s.y, s.s, s.s);
      });

      ctx.fillStyle = "#777";
      debris.forEach(d => ctx.fillRect(d.x, d.y, d.w, d.h));

      drawShip();
      drawUI();

      ctx.fillStyle = "#ffea00";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      enemies.forEach(e => drawEnemyShip(e));

      ctx.fillStyle = "#ff4444";
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      powerups.forEach(p => {
        if (p.type === "shield") drawImagePowerup(p.x, p.y, shieldImg);
        if (p.type === "rapid")  drawImagePowerup(p.x, p.y, rapidImg);
        if (p.type === "double") drawImagePowerup(p.x, p.y, doubleImg);
        if (p.type === "life")   drawImagePowerup(p.x, p.y, lifeImg);
      });

      if (!running && gameRunning) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "14px system-ui";
        ctx.fillText("Score: " + spaceScore, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("Tap to play again", canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    // ---------- END GAME ----------
    function endSpaceGame() {
      running = false;
      gameRunning = false;
      submitSpaceShooterScore(spaceScore);
      drawSpace();
    }

    // ---------- INPUT ----------
    document.addEventListener("keydown", e => {
      if (!running) return;

      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        ship.x -= ship.speed * 3;
        if (ship.x < 0) ship.x = 0;
      }
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        ship.x += ship.speed * 3;
        if (ship.x + ship.w > canvas.width) ship.x = canvas.width - ship.w;
      }
    }, { passive: false });

    let dragging = false;

    canvas.addEventListener("touchstart", e => {
      e.preventDefault();
      dragging = true;
    });

    canvas.addEventListener("touchmove", e => {
      if (!dragging || !running) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.touches[0].clientX - rect.left;

      ship.x = x - ship.w / 2;
      if (ship.x < 0) ship.x = 0;
      if (ship.x + ship.w > canvas.width) ship.x = canvas.width - ship.w;
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      dragging = false;
    });

    // ---------- LEADERBOARD ----------
    async function submitSpaceShooterScore(score) {
      try {
        await fetch("https://leaderboard.shadownetcg-f2f.workers.dev/submit?game=spaceshooter", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: localStorage.getItem("playerName"),
            score: score
          })
        });
      } catch (err) {
        console.log("Score upload failed:", err);
      }
    }

    resetSpaceGame();
    drawSpace();

    function sendHeight() {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: "resize-iframe", height }, "*");
    }

    window.onload = sendHeight;
    setInterval(sendHeight, 300);
    
  </script>
</body>
</html>
