<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflower Land – Play Now</title>

<style>
  body {
    margin: 0;
    background: #0d1117;
    font-family: Arial, sans-serif;
    color: #f0f0f0;
  }

  .page-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 25px;
  }

  .header img {
    width: 180px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255, 200, 0, 0.4);
  }

  h1 {
    margin-top: 15px;
    font-size: 32px;
    color: #facc15;
  }

  .description {
    text-align: center;
    font-size: 16px;
    color: #d1d5db;
    margin-bottom: 30px;
  }

  /* Game Frame Placeholder */
  .game-frame {
    width: 100%;
    height: 600px;
    background: #111827;
    border: 2px solid #1f2937;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
  }

  .game-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
</style>
</head>

<body>

<div class="page-wrapper">

  <div class="header">
    <img src="https://sunflower-land.com/social-card.png" alt="Sunflower Land">
    <h1>Sunflower Land</h1>
  </div>

  <p class="description">
    Grow crops, craft items, expand your land, and build your dream farm.  
    Sunflower Land is a blockchain‑powered farming game with a huge community.
  </p>


  <div class="game-frame" id="gameFrame">
    <iframe src="https://sunflower-land.com/play/#/"></iframe>
  </div>


</div>

</body>
</html>
