<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflower Land – Play Now</title>

<style>
  body {
    margin: 0;
    background: #0d1117;
    font-family: Arial, sans-serif;
    color: #f0f0f0;
  }

  .page-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 25px;
  }

  .header img {
    width: 180px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255, 200, 0, 0.4);
  }

  h1 {
    margin-top: 15px;
    font-size: 32px;
    color: #facc15;
  }

  .description {
    text-align: center;
    font-size: 16px;
    color: #d1d5db;
    margin-bottom: 30px;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: #0d1117;
    overflow: hidden;
  }

  .game-frame {
    position: fixed;
    top: 100px; /* space for your ad */
    left: 0;
    width: 100%;
    height: calc(100% - 60px);
    background: #111827;
    border-top: 2px solid #1f2937;
  }

  .game-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

</style>
</head>

<body>

  <div id="ad-container" style="text-align:center; padding:10px;"></div>


  <script>
function loadAd() {
    const container = document.getElementById("ad-container");
    container.innerHTML = ""; // clear old ad

    // Create atOptions script
    const optScript = document.createElement("script");
    optScript.type = "text/javascript";
    optScript.innerHTML = `
      atOptions = {
        'key' : '038d24b547d54cdddae17e5d45b3519f',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    `;

    // Create invoke.js script
    const invokeScript = document.createElement("script");
    invokeScript.type = "text/javascript";
    invokeScript.src = "https://glamournakedemployee.com/038d24b547d54cdddae17e5d45b3519f/invoke.js";

    // Append both scripts
    container.appendChild(optScript);
    container.appendChild(invokeScript);
}

// Initial load
loadAd();

// Refresh every 5 minutes (300000 ms)
setInterval(loadAd, 300000);
</script>


  <div class="game-frame" id="gameFrame">
    <iframe src="https://sunflower-land.com/play/#/"></iframe>
  </div>


</div>

</body>
</html>
