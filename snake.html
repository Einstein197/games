<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake – Krypton Arcade</title>
  <style>
    body {
      margin: 0;
      background: #050509;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin: 16px 0 4px;
    }
    p {
      margin: 0 0 10px;
      font-size: 14px;
      opacity: 0.8;
    }
    canvas {
      background: #111;
      border: 2px solid #333;
      margin-top: 10px;
      width: 90vw;
      max-width: 320px;
      height: auto;
      touch-action: none;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #ff7b00;
      color: #050509;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <p>Swipe or use arrow keys. Tap “Start” to play.</p>
  <button onclick="startSnake()">Start</button>
  <canvas id="snakeCanvas" width="240" height="240"></canvas>

  <script>
    window.addEventListener("keydown", e => {
      if (e.code === "Space") e.preventDefault();
    }, { passive: false });

    const snakeCanvas = document.getElementById("snakeCanvas");
    const snakeCtx = snakeCanvas.getContext("2d");
    let snake, food, dx, dy, snakeInterval;

    function startSnake() {
      snake = [{x:120, y:120}];
      dx = 10; dy = 0;
      food = {x: 80, y: 80};
      clearInterval(snakeInterval);
      snakeInterval = setInterval(updateSnake, 200);
    }

    function updateSnake() {
      let head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        food.x = Math.floor(Math.random()*24)*10;
        food.y = Math.floor(Math.random()*24)*10;
      } else {
        snake.pop();
      }

      snakeCtx.fillStyle = "#111";
      snakeCtx.fillRect(0,0,240,240);

      snakeCtx.fillStyle = "lime";
      snake.forEach(p => snakeCtx.fillRect(p.x, p.y, 10, 10));

      snakeCtx.fillStyle = "red";
      snakeCtx.fillRect(food.x, food.y, 10, 10);

      if (head.x < 0 || head.x >= 240 || head.y < 0 || head.y >= 240 ||
          snake.slice(1).some(p => p.x === head.x && p.y === head.y)) {
        alert("Game Over");
        clearInterval(snakeInterval);
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy === 0) {dx=0; dy=-10;}
      if (e.key === "ArrowDown" && dy === 0) {dx=0; dy=10;}
      if (e.key === "ArrowLeft" && dx === 0) {dx=-10; dy=0;}
      if (e.key === "ArrowRight" && dx === 0) {dx=10; dy=0;}
    });

    let sx = 0, sy = 0;
    snakeCanvas.addEventListener("touchstart", e => {
      const t = e.touches[0];
      sx = t.clientX;
      sy = t.clientY;
    });
    snakeCanvas.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      const dxTouch = t.clientX - sx;
      const dyTouch = t.clientY - sy;
      if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
        if (dxTouch > 0 && dx === 0) { dx = 10; dy = 0; }
        else if (dxTouch < 0 && dx === 0) { dx = -10; dy = 0; }
      } else {
        if (dyTouch > 0 && dy === 0) { dx = 0; dy = 10; }
        else if (dyTouch < 0 && dy === 0) { dx = 0; dy = -10; }
      }
    });
  </script>
</body>
</html>
