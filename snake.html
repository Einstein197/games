<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake – Krypton Arcade</title>
  <style>
    body {
      margin: 0;
      background: #050509;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 16px 0 4px; }
    p { margin: 0 0 10px; font-size: 14px; opacity: 0.8; }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }

    #score {
      font-size: 18px;
      font-weight: 600;
      color: #ff7b00;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #ff7b00;
      color: #050509;
      font-weight: 600;
      cursor: pointer;
    }

    canvas {
      background: #111;
      border: 2px solid #333;
      margin-top: 10px;
      width: 90vw;
      max-width: 320px;
      height: auto;
      touch-action: none;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>
  <p>Swipe or use arrow keys. Tap “Start” to play.</p>

  <div class="row">
    <button onclick="startSnake()">Start</button>
    <div id="score">Score: 0</div>
  </div>

  <canvas id="snakeCanvas" width="240" height="240"></canvas>

  <script>
    // Prevent space from scrolling page
    window.addEventListener("keydown", e => {
      if (e.code === "Space") e.preventDefault();
    }, { passive: false });

    const snakeCanvas = document.getElementById("snakeCanvas");
    const snakeCtx = snakeCanvas.getContext("2d");
    const scoreBox = document.getElementById("score");

    // Krypton logo as food
    const kryptonImg = new Image();
    kryptonImg.src = "krypton.png";

    let snake, food, dx, dy, snakeInterval, score;

    function startSnake() {
      snake = [
        {x:120, y:120},
        {x:110, y:120},
        {x:100, y:120}
      ];
      dx = 10; dy = 0;
      score = 0;
      updateScore();
      food = {x: 80, y: 80};
      clearInterval(snakeInterval);
      snakeInterval = setInterval(updateSnake, 200);
    }

    function updateScore() {
      scoreBox.textContent = "Score: " + score;
    }

    function updateSnake() {
      let head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score++;
        updateScore();
        food.x = Math.floor(Math.random()*24)*10;
        food.y = Math.floor(Math.random()*24)*10;
      } else {
        snake.pop();
      }

      // Clear board
      snakeCtx.fillStyle = "#111";
      snakeCtx.fillRect(0,0,240,240);

      drawSnake();
      drawFood();

      // Collision
      if (head.x < 0 || head.x >= 240 || head.y < 0 || head.y >= 240 ||
          snake.slice(1).some(p => p.x === head.x && p.y === head.y)) {
        alert("Game Over! Final Score: " + score);
        clearInterval(snakeInterval);
      }
    }

    function drawSnake() {
      // BODY segments (excluding head and tail)
      for (let i = 1; i < snake.length - 1; i++) {
        snakeCtx.fillStyle = "#32cd32";
        snakeCtx.beginPath();
        snakeCtx.roundRect(snake[i].x, snake[i].y, 10, 10, 3);
        snakeCtx.fill();
      }

      // TAIL – arrow pointing AWAY from snake
      if (snake.length >= 2) {
        let tail = snake[snake.length - 1];
        let beforeTail = snake[snake.length - 2];

        // Center of tail segment
        let tx = tail.x + 5;
        let ty = tail.y + 5;

        // Direction from body toward tail (tail should point away from body)
        let angleTail = Math.atan2(tail.y - beforeTail.y, tail.x - beforeTail.x);

        snakeCtx.save();
        snakeCtx.translate(tx, ty);
        snakeCtx.rotate(angleTail);

        snakeCtx.fillStyle = "#2eb82e";
        snakeCtx.beginPath();
        // Base near body
        snakeCtx.moveTo(0, -4);
        snakeCtx.lineTo(8, 0);   // tip pointing away
        snakeCtx.lineTo(0, 4);
        snakeCtx.closePath();
        snakeCtx.fill();

        snakeCtx.restore();
      }

      // HEAD – rotates with direction, tongue too
      let head = snake[0];
      let neck = snake[1] || head; // fallback if very short

      // Center of head
      let hx = head.x + 5;
      let hy = head.y + 5;

      // Direction from neck to head (movement direction)
      let angleHead = Math.atan2(head.y - neck.y, head.x - neck.x);

      snakeCtx.save();
      snakeCtx.translate(hx, hy);
      snakeCtx.rotate(angleHead);

      // Head block (centered)
      snakeCtx.fillStyle = "#39ff14";
      snakeCtx.beginPath();
      snakeCtx.roundRect(-5, -5, 10, 10, 3);
      snakeCtx.fill();

      // Eyes (front side is +x)
      snakeCtx.fillStyle = "#000";
      snakeCtx.fillRect(1, -3, 2, 2);
      snakeCtx.fillRect(1, 1, 2, 2);

      // Tongue (extends forward in movement direction)
      snakeCtx.fillStyle = "red";
      snakeCtx.fillRect(5, -1, 3, 4);

      snakeCtx.restore();
    }

    function drawFood() {
      if (kryptonImg.complete) {
        snakeCtx.drawImage(kryptonImg, food.x, food.y, 10, 10);
      } else {
        snakeCtx.fillStyle = "#ff7b00";
        snakeCtx.fillRect(food.x, food.y, 10, 10);
      }
    }

    // Keyboard controls
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy === 0) {dx=0; dy=-10;}
      if (e.key === "ArrowDown" && dy === 0) {dx=0; dy=10;}
      if (e.key === "ArrowLeft" && dx === 0) {dx=-10; dy=0;}
      if (e.key === "ArrowRight" && dx === 0) {dx=10; dy=0;}
    });

    // Touch controls
    let sx = 0, sy = 0;
    snakeCanvas.addEventListener("touchstart", e => {
      const t = e.touches[0];
      sx = t.clientX;
      sy = t.clientY;
    });
    snakeCanvas.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      const dxTouch = t.clientX - sx;
      const dyTouch = t.clientY - sy;
      if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
        if (dxTouch > 0 && dx === 0) { dx = 10; dy = 0; }
        else if (dxTouch < 0 && dx === 0) { dx = -10; dy = 0; }
      } else {
        if (dyTouch > 0 && dy === 0) { dx = 0; dy = 10; }
        else if (dyTouch < 0 && dy === 0) { dx = 0; dy = -10; }
      }
    });
  </script>

</body>
</html>
