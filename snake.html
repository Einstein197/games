<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake – Krypton Arcade</title>

  <style>
    body {
      margin: 0;
      background: #050509;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 { margin: 16px 0 4px; }
    p { margin: 0 0 10px; font-size: 14px; opacity: 0.8; }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }

    #score {
      font-size: 18px;
      font-weight: 600;
      color: #ff7b00;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #ff7b00;
      color: #050509;
      font-weight: 600;
      cursor: pointer;
    }

    canvas {
      background: #111;
      border: 2px solid #333;
      margin-top: 10px;
      width: 90vw;
      max-width: 320px;
      height: auto;
      touch-action: none;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>
  <p>Swipe or use arrow keys. Tap “Start” to play.</p>

  <div class="row">
    <button onclick="startSnake()">Start</button>
    <div id="score">Score: 0</div>
  </div>

  <canvas id="snakeCanvas" width="240" height="240"></canvas>

  <script>
    /* PLAYER ID + NAME SYSTEM */
    if (!localStorage.getItem("playerID")) {
      const id = "player_" + Math.random().toString(16).slice(2, 8).toUpperCase();
      localStorage.setItem("playerID", id);
    }

    if (!localStorage.getItem("playerName")) {
      localStorage.setItem("playerName", localStorage.getItem("playerID"));
    }

    /* SAVE SCORE TO CLOUDFLARE */
    async function saveScore(score) {
      try {
        await fetch("https://leaderboard.shadownetcg-f2f.workers.dev/submit?game=snake", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: localStorage.getItem("playerName"),
            score: score
          })
        });
      } catch (err) {
        console.log("Score upload failed:", err);
      }
    }


    /* GAME VARS */
    const snakeCanvas = document.getElementById("snakeCanvas");
    const snakeCtx = snakeCanvas.getContext("2d");
    const scoreBox = document.getElementById("score");

    const kryptonImg = new Image();
    kryptonImg.src = "krypton.png";

    let snake, food, dx, dy, snakeInterval, score;

    /* COLOR CYCLE */
    const snakeColors = [
      "#32cd32", // green
      "#00e5ff", // cyan
      "#ffee58", // yellow
      "#ba68c8", // purple
      "#ff6eb4"  // pink
    ];

    let currentColorIndex = 0;
    let segmentsGrown = 0;

    function startSnake() {
      snake = [
        {x:120, y:120, color:"#32cd32"},
        {x:110, y:120, color:"#32cd32"},
        {x:100, y:120, color:"#32cd32"}
      ];

      dx = 10; dy = 0;
      score = 0;
      segmentsGrown = 0;
      currentColorIndex = 0;

      updateScore();
      food = {x: 80, y: 80};

      clearInterval(snakeInterval);
      snakeInterval = setInterval(updateSnake, 150);
    }

    function updateScore() {
      scoreBox.textContent = "Score: " + score;
    }

    function updateSnake() {

      /* REAL FIX:
         New head inherits the OLD head's color (snake[1]),
         NOT the new head's overwritten color (snake[0]).
      */
      let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy,
        color: snake[1] ? snake[1].color : snake[0].color
      };

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        updateScore();

        segmentsGrown++;

        // Every 10 segments → next color
        if (segmentsGrown % 10 === 0) {
          currentColorIndex = (currentColorIndex + 1) % snakeColors.length;
        }

        // NEW SEGMENT gets the NEW color
        snake[0].color = snakeColors[currentColorIndex];

        // Move food
        food.x = Math.floor(Math.random()*24)*10;
        food.y = Math.floor(Math.random()*24)*10;

      } else {
        snake.pop();
      }

      snakeCtx.fillStyle = "#111";
      snakeCtx.fillRect(0,0,240,240);

      drawSnake();
      drawFood();

      if (head.x < 0 || head.x >= 240 || head.y < 0 || head.y >= 240 ||
          snake.slice(1).some(p => p.x === head.x && p.y === head.y)) {
        alert("Game Over! Final Score: " + score);
        clearInterval(snakeInterval);
        saveScore(score);
      }
    }

    function drawSnake() {
      /* BODY */
      for (let i = 1; i < snake.length - 1; i++) {
        snakeCtx.fillStyle = snake[i].color;
        snakeCtx.beginPath();
        snakeCtx.roundRect(snake[i].x, snake[i].y, 10, 10, 3);
        snakeCtx.fill();
      }

      /* TAIL */
      if (snake.length >= 2) {
        let tail = snake[snake.length - 1];
        let beforeTail = snake[snake.length - 2];

        let tx = tail.x + 5;
        let ty = tail.y + 5;

        let angleTail = Math.atan2(tail.y - beforeTail.y, tail.x - beforeTail.x);

        snakeCtx.save();
        snakeCtx.translate(tx, ty);
        snakeCtx.rotate(angleTail);

        snakeCtx.fillStyle = tail.color;
        snakeCtx.beginPath();
        snakeCtx.moveTo(0, -4);
        snakeCtx.lineTo(8, 0);
        snakeCtx.lineTo(0, 4);
        snakeCtx.closePath();
        snakeCtx.fill();

        snakeCtx.restore();
      }

      /* HEAD */
      let head = snake[0];
      let neck = snake[1] || head;

      let hx = head.x + 5;
      let hy = head.y + 5;

      let angleHead = Math.atan2(head.y - neck.y, head.x - neck.x);

      snakeCtx.save();
      snakeCtx.translate(hx, hy);
      snakeCtx.rotate(angleHead);

      snakeCtx.fillStyle = head.color;
      snakeCtx.beginPath();
      snakeCtx.roundRect(-5, -5, 10, 10, 3);
      snakeCtx.fill();

      snakeCtx.fillStyle = "#000";
      snakeCtx.fillRect(1, -3, 2, 2);
      snakeCtx.fillRect(1, 1, 2, 2);

      snakeCtx.fillStyle = "red";
      snakeCtx.fillRect(5, -1, 3, 4);

      snakeCtx.restore();
    }

    function drawFood() {
      if (kryptonImg.complete) {
        snakeCtx.drawImage(kryptonImg, food.x, food.y, 10, 10);
      } else {
        snakeCtx.fillStyle = "#ff7b00";
        snakeCtx.fillRect(food.x, food.y, 10, 10);
      }
    }

    /* CONTROLS */
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy === 0) {dx=0; dy=-10;}
      if (e.key === "ArrowDown" && dy === 0) {dx=0; dy=10;}
      if (e.key === "ArrowLeft" && dx === 0) {dx=-10; dy=0;}
      if (e.key === "ArrowRight" && dx === 0) {dx=10; dy=0;}
    });

    let sx = 0, sy = 0;
    snakeCanvas.addEventListener("touchstart", e => {
      const t = e.touches[0];
      sx = t.clientX;
      sy = t.clientY;
    });
    snakeCanvas.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      const dxTouch = t.clientX - sx;
      const dyTouch = t.clientY - sy;
      if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
        if (dxTouch > 0 && dx === 0) { dx = 10; dy = 0; }
        else if (dxTouch < 0 && dx === 0) { dx = -10; dy = 0; }
      } else {
        if (dyTouch > 0 && dy === 0) { dx = 0; dy = 10; }
        else if (dyTouch < 0 && dy === 0) { dx = 0; dy = -10; }
      }
    });
  </script>

</body>
</html>
