<!-- GAME GRID -->
<div class="grid" id="gameGrid">

  <!-- Snake -->
  <div class="card" onclick="openGame('snake.html', 'snake')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs><radialGradient id="snakeGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb366"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
        </radialGradient></defs>
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#snakeGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
        <path d="M30 60 Q40 40 50 50 T70 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="68" cy="38" r="2" fill="#ffffff"/>
      </svg>
    </div>
    <div class="card-title">Snake</div>
    <div class="card-sub">Swipe or arrows</div>
  </div>

  <!-- Flappy -->
  <div class="card" onclick="openGame('flappy.html', 'flappy')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs><radialGradient id="flappyGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb366"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
        </radialGradient></defs>
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#flappyGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
        <path d="M30 55 Q40 35 60 40 Q70 43 65 50 Q60 57 50 55 Z" fill="#ffffff"/>
        <circle cx="56" cy="44" r="2" fill="#050509"/>
      </svg>
    </div>
    <div class="card-title">Flappy Bird</div>
    <div class="card-sub">Tap to flap</div>
  </div>

  <!-- Dodge -->
  <div class="card" onclick="openGame('dodge.html', 'dodge')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs><radialGradient id="dodgeGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb366"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
        </radialGradient></defs>
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#dodgeGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
        <rect x="30" y="60" width="18" height="10" fill="#ffffff"/>
        <rect x="55" y="30" width="12" height="12" fill="#ffffff"/>
        <line x1="61" y1="42" x2="61" y2="55" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>
      </svg>
    </div>
    <div class="card-title">Dodge</div>
    <div class="card-sub">Avoid the block</div>
  </div>

  <!-- 2048 -->
  <div class="card" onclick="openGame('2048.html', '2048')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs><radialGradient id="g2048Glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb366"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
        </radialGradient></defs>
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#g2048Glow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
        <rect x="30" y="35" width="40" height="30" rx="6" fill="#ff9a2b"/>
        <text x="50" y="55" text-anchor="middle" fill="#ffffff" font-size="16" font-family="system-ui">2048</text>
      </svg>
    </div>
    <div class="card-title">2048</div>
    <div class="card-sub">Swipe or arrows</div>
  </div>

  <!-- Coin -->
  <div class="card" onclick="openGame('coin.html', 'coin')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs><radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb366"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
        </radialGradient></defs>
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#coinGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
        <circle cx="50" cy="50" r="16" fill="#ffcc4d" stroke="#ffe38a" stroke-width="2"/>
        <circle cx="50" cy="50" r="10" fill="#ffb700"/>
      </svg>
    </div>
    <div class="card-title">Click the Coin</div>
    <div class="card-sub">Tap fast for score</div>
  </div>


  <!-- Gravity Warp -->
  <div class="card" onclick="openGame('gravitywarp.html', 'gravitywarp')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs><radialGradient id="warpGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb366"/>
          <stop offset="60%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
        </radialGradient></defs>
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#warpGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
        <circle cx="50" cy="50" r="4" fill="#ff7b00"/>
      </svg>
    </div>
    <div class="card-title">Gravity Warp</div>
    <div class="card-sub">Direct control</div>
  </div>


  <!-- Space Shooter -->
  <div class="card" onclick="openGame('spaceshooter.html', 'spaceshooter')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="shipGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4fd5ff"/>
            <stop offset="60%" stop-color="#00aaff"/>
            <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Background glow -->
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#shipGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#4fd5ff" stroke-width="3"/>

        <!-- ⭐ SPACESHIP ICON ⭐ -->
        <g transform="translate(50 50)">
          <!-- Body -->
          <path d="M0 -20 L10 10 L0 5 L-10 10 Z" fill="#4fd5ff"/>
          <!-- Cockpit -->
          <ellipse cx="0" cy="-10" rx="4" ry="6" fill="#00ffa8"/>
          <!-- Thruster flame -->
          <path d="M-4 10 L0 18 L4 10 Z" fill="#ffb300"/>
        </g>
      </svg>
    </div>

    <div class="card-title">Space Shooter</div>
    <div class="card-sub">Arcade survival</div>
  </div>

  <!-- Farm Game -->
  <div class="card" onclick="openFarm('tractorsim/index.html', 'farm')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="farmGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7fff5a"/>
            <stop offset="60%" stop-color="#3ecf2c"/>
            <stop offset="100%" stop-color="#3ecf2c" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Background glow -->
        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#farmGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#7fff5a" stroke-width="3"/>

        <!-- 🌾 FARM ICON -->
        <g transform="translate(50 50)">
          <!-- Barn -->
          <rect x="-12" y="-10" width="24" height="20" fill="#d13f3f"/>
          <polygon points="-12 -10 0 -22 12 -10" fill="#b83232"/>
          <rect x="-6" y="0" width="12" height="10" fill="#ffffff"/>

          <!-- Crop rows -->
          <path d="M-20 18 L20 18" stroke="#7fff5a" stroke-width="3"/>
          <path d="M-20 22 L20 22" stroke="#5fd94a" stroke-width="3"/>
        </g>
      </svg>
    </div>

    <div class="card-title">Krypton Farm</div>
    <div class="card-sub">Grow • Harvest • Expand</div>
  </div>
  
  <!-- Sunflower Land Game -->
  <div class="card" onclick="openFarm('sunflowerland.html', 'sunflowerland')">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100">
        <!-- Glow -->
        <defs>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#facc15"/>
            <stop offset="60%" stop-color="#eab308"/>
            <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <circle cx="50" cy="50" r="40" fill="#050509"/>
        <circle cx="50" cy="50" r="40" fill="url(#sunGlow)"/>
        <circle cx="50" cy="50" r="32" fill="#050509" stroke="#facc15" stroke-width="3"/>

        <!-- 🌻 Sunflower Icon -->
        <g transform="translate(50 50)">
          <!-- Petals -->
          <g fill="#facc15">
            <circle r="20" cx="0" cy="-20"/>
            <circle r="20" cx="14" cy="-14"/>
            <circle r="20" cx="20" cy="0"/>
            <circle r="20" cx="14" cy="14"/>
            <circle r="20" cx="0" cy="20"/>
            <circle r="20" cx="-14" cy="14"/>
            <circle r="20" cx="-20" cy="0"/>
            <circle r="20" cx="-14" cy="-14"/>
          </g>

          <!-- Center -->
          <circle r="18" fill="#5b3a1a"/>
        </g>
      </svg>
    </div>

    <div class="card-title">Sunflower Land</div>
    <div class="card-sub">Grow • Craft • Expand</div>
  </div>






</div> <!-- end grid -->
