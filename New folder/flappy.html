<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird – Krypton Arcade</title>

  <style>
    body {
      margin: 0;
      background: #050509;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 { margin: 16px 0 4px; }
    p { margin: 0 0 10px; font-size: 14px; opacity: 0.8; }

    canvas {
      background: #111;
      border: 2px solid #333;
      margin-top: 10px;
      width: 90vw;
      max-width: 320px;
      height: auto;
      margin-bottom: 20px;
      touch-action: none;
    }
  </style>
</head>
<body>

  <h1>Flappy Bird</h1>
  <p>Tap or press SPACE to flap. Tap canvas to start.</p>

  <canvas id="flappyCanvas" width="240" height="300"></canvas>

  <script>
    /* PLAYER NAME */
    if (!localStorage.getItem("playerID")) {
      const id = "player_" + Math.random().toString(16).slice(2, 8).toUpperCase();
      localStorage.setItem("playerID", id);
    }
    if (!localStorage.getItem("playerName")) {
      localStorage.setItem("playerName", localStorage.getItem("playerID"));
    }

    /* PREVENT SPACE SCROLL */
    window.addEventListener("keydown", e => {
      if (e.code === "Space") e.preventDefault();
    }, { passive: false });

    const flappyCanvas = document.getElementById("flappyCanvas");
    const flappyCtx = flappyCanvas.getContext("2d");

    let birdY, birdVel, pipes, score, highScore, running = false, lastTime = 0;

    // Bird animation
    let birdAngle = 0;
    let wingAngle = 0;
    let wingDir = 1;

    highScore = Number(localStorage.getItem("flappyHighScore")) || 0;

    function startFlappy() {
      birdY = 150;
      birdVel = 0;
      pipes = [];
      score = 0;
      running = true;
      pipes.push(makePipe(240));
      lastTime = performance.now();
      requestAnimationFrame(loopFlappy);
    }

    function makePipe(x) {
      return {
        x,
        width: 40,
        gap: 140,
        top: Math.random() * 140 + 20,
        scored: false
      };
    }

    function loopFlappy(ts) {
      if (!running) return;
      const dt = (ts - lastTime) / 16.67;
      lastTime = ts;
      updateFlappy(dt);
      drawFlappy();
      requestAnimationFrame(loopFlappy);
    }

    function updateFlappy(dt) {
      birdVel += 0.18 * dt;
      if (birdVel > 3) birdVel = 3;
      birdY += birdVel * dt;

      pipes.forEach(p => p.x -= 1.5 * dt);
      if (pipes[pipes.length - 1].x < 120) pipes.push(makePipe(240));
      if (pipes[0].x < -50) pipes.shift();

      pipes.forEach(p => {
        if (!p.scored && p.x + p.width < 50) {
          p.scored = true;
          score++;
        }
      });

      pipes.forEach(p => {
        if (50 < p.x + p.width && 70 > p.x &&
            (birdY < p.top || birdY + 20 > p.top + p.gap)) {
          endFlappy();
        }
      });

      if (birdY < 0 || birdY > 300) endFlappy();

      // Wing flap
      wingAngle += wingDir * 0.15 * dt;
      if (wingAngle > 0.7) { wingAngle = 0.7; wingDir = -1; }
      if (wingAngle < -0.7) { wingAngle = -0.7; wingDir = 1; }

      // Rotation
      if (birdVel < -1) birdAngle = -20;
      else {
        birdAngle += 2 * dt;
        if (birdAngle > 60) birdAngle = 60;
      }
    }

    function drawFlappy() {
      flappyCtx.fillStyle = "#111";
      flappyCtx.fillRect(0,0,240,320);

      const cx = 50 + 12;
      const cy = birdY + 12;

      flappyCtx.save();
      flappyCtx.translate(cx, cy);
      flappyCtx.rotate(birdAngle * Math.PI / 180);

      // BODY
      flappyCtx.fillStyle = "#e8e6df";
      flappyCtx.beginPath();
      flappyCtx.ellipse(0, 0, 16, 6, 0, 0, Math.PI * 2);
      flappyCtx.fill();

      // HEAD
      flappyCtx.fillStyle = "#f2f0e9";
      flappyCtx.beginPath();
      flappyCtx.ellipse(12, -2, 6, 6, 0, 0, Math.PI * 2);
      flappyCtx.fill();

      // BEAK
      flappyCtx.fillStyle = "#ffb347";
      flappyCtx.beginPath();
      flappyCtx.moveTo(18, -2);
      flappyCtx.lineTo(24, -3);
      flappyCtx.lineTo(18, 0);
      flappyCtx.closePath();
      flappyCtx.fill();

      // EYE
      flappyCtx.fillStyle = "#ffffff";
      flappyCtx.beginPath();
      flappyCtx.arc(13, -4, 2.2, 0, Math.PI * 2);
      flappyCtx.fill();
      flappyCtx.fillStyle = "#000000";
      flappyCtx.beginPath();
      flappyCtx.arc(13.5, -4, 1.1, 0, Math.PI * 2);
      flappyCtx.fill();

      // LEFT WING
      flappyCtx.save();
      flappyCtx.rotate(-wingAngle);
      flappyCtx.fillStyle = "#e8e6df";
      flappyCtx.beginPath();
      flappyCtx.ellipse(-10, 0, 10, 4, 0, 0, Math.PI * 2);
      flappyCtx.fill();
      flappyCtx.restore();

      // RIGHT WING
      flappyCtx.save();
      flappyCtx.rotate(wingAngle);
      flappyCtx.fillStyle = "#e8e6df";
      flappyCtx.beginPath();
      flappyCtx.ellipse(10, 0, 10, 4, 0, 0, Math.PI * 2);
      flappyCtx.fill();
      flappyCtx.restore();

      // TAIL
      flappyCtx.fillStyle = "#dcdad3";
      flappyCtx.beginPath();
      flappyCtx.moveTo(-16, 0);
      flappyCtx.lineTo(-22, -2 + wingAngle * 3);
      flappyCtx.lineTo(-16, 2);
      flappyCtx.closePath();
      flappyCtx.fill();

      flappyCtx.restore();

      // Pipes
      flappyCtx.fillStyle = "green";
      pipes.forEach(p => {
        flappyCtx.fillRect(p.x, 0, p.width, p.top);
        flappyCtx.fillRect(p.x, p.top + p.gap, p.width, 320);
      });

      // Score
      flappyCtx.fillStyle = "white";
      flappyCtx.font = "18px Arial";
      flappyCtx.fillText("Score: " + score, 10, 25);
      flappyCtx.fillText("Best: " + highScore, 150, 25);
    }

    function endFlappy() {
      running = false;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("flappyHighScore", highScore);
      }

      submitFlappyScore(score);

      flappyCtx.fillStyle = "white";
      flappyCtx.font = "24px Arial";
      flappyCtx.fillText("Game Over!", 60, 150);
      flappyCtx.font = "18px Arial";
      flappyCtx.fillText("Tap to Restart", 65, 190);
    }

    /* SUBMIT SCORE TO CLOUDFLARE */
    async function submitFlappyScore(score) {
      try {
        await fetch("https://leaderboard.shadownetcg-f2f.workers.dev/submit?game=flappy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: localStorage.getItem("playerName"),
            score: score
          })
        });
      } catch (err) {
        console.log("Score upload failed:", err);
      }
    }

    /* CONTROLS */
    document.addEventListener("keydown", e => {
      if (e.code === "Space") {
        if (!running) startFlappy();
        else birdVel = -4.5;
      }
    });

    flappyCanvas.addEventListener("touchstart", e => {
      e.preventDefault();
      if (!running) startFlappy();
      else birdVel = -4.5;
    }, { passive: false });

    flappyCanvas.addEventListener("click", () => {
      if (!running) startFlappy();
      else birdVel = -4.5;
    });

    function sendHeight() {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: "resize-iframe", height }, "*");
    }

    window.onload = sendHeight;
    setInterval(sendHeight, 300);
  </script>

</body>
</html>
