<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Krypton SimFarm Deluxe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #050509;
  color: #eee;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin: 6px 0;
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: .08em;
}

#topBar, #bottomBar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 4px;
  font-size: 11px;
}

.panel, .small-panel {
  background: #10131a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 4px 8px;
}

.small-panel {
  min-width: 140px;
}

button, select {
  background: #1a1d26;
  color: #eee;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 4px 7px;
  font-size: 11px;
  cursor: pointer;
}

button:hover {
  background: #222735;
}

#farm {
  width: 94vmin;
  height: 94vmin;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(10, 1fr);
  gap: .5vmin;
  background: #06070c;
  border: 1px solid #333;
  border-radius: 12px;
  padding: .5vmin;
  box-sizing: border-box;
}

.tile {
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4vmin;
  cursor: pointer;
  transition: transform .05s;
  user-select: none;
}

.tile:hover {
  transform: translateY(-1px);
}

.locked {
  background: #111;
  border: 1px solid #222;
}

.empty {
  background: #2b2415;
  border: 1px solid #3a3120;
}

.planted {
  background: #3d331a;
  border: 1px solid #57421d;
}

.growing {
  background: #56421d;
  border: 1px solid #866225;
}

.ready {
  background: #567d2a;
  border: 1px solid #9bd740;
  box-shadow: 0 0 10px rgba(150,255,80,.25);
}

.dead {
  background: #444;
  border: 1px solid #666;
}

#msg {
  height: 18px;
  font-size: 12px;
  padding: 5px;
}

.good {
  filter: brightness(1.1);
}

.excellent {
  filter: brightness(1.2) saturate(1.2);
}

.golden {
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 5px gold; }
  to { box-shadow: 0 0 18px gold; }
}
</style>
</head>

<body>

<h1>Krypton SimFarm Deluxe</h1>

<div id="topBar">
  <div class="panel">Coins: <span id="coins"></span></div>
  <div class="panel">
    Lv <span id="level"></span> —
    XP <span id="xp"></span>/<span id="xpNext"></span>
  </div>
  <div class="panel">
    <span id="season"></span> Day <span id="day"></span>
  </div>
  <div class="panel">
    Weather: <span id="weather"></span>
  </div>
  <div class="panel">
    <select id="seedSelect"></select>
  </div>

  <button id="expandBtn"></button>
  <button id="resetBtn">Reset</button>
</div>

<div id="farm"></div>

<div id="msg"></div>

<div id="bottomBar">
  <div class="small-panel" id="marketInfo"></div>
  <div class="small-panel" id="townInfo"></div>
  <div class="small-panel" id="machineInfo"></div>
</div>

<script>

const SAVE_KEY = "krypton_simfarm_deluxe";

const SEASONS = ["Spring", "Summer", "Fall", "Winter"];

const WEATHER_TYPES = [
  "Sunny",
  "Rain",
  "Cloudy",
  "Storm",
  "Drought",
  "Snow"
];

const CROPS = [

  {
    id: "wheat",
    emoji: "🌾",
    name: "Wheat",
    baseCost: 5,
    baseSell: 10,
    growSeconds: 30,
    xp: 2,

    bestSeasons: ["Spring","Fall"]
  },

  {
    id: "potato",

    name: "Potato",
    baseCost: 8,
    baseSell: 16,
    growSeconds: 45,
    xp: 3,
    levelRequired: 1,
    bestSeasons: ["Spring","Winter"]
  },

  {
    id: "corn",

    name: "Corn",
    baseCost: 12,
    baseSell: 24,
    growSeconds: 70,
    xp: 5,
    levelRequired: 2,
    bestSeasons: ["Summer"]
  },

  {
    id: "tomato",
    emoji: "🍅",
    name: "Tomato",
    baseCost: 16,
    baseSell: 32,
    growSeconds: 85,
    xp: 6,
    levelRequired: 2,
    bestSeasons: ["Summer"]
  },

  {
    id: "carrot",
    emoji: "🥕",
    name: "Carrot",
    baseCost: 20,

    growSeconds: 120,
    xp: 10,

    bestSeasons: ["Spring","Fall"]
  },

  {
    id: "rice",

    name: "Rice",
    baseCost: 25,

    growSeconds: 135,
    xp: 12,
    levelRequired: 3,
    bestSeasons: ["Summer"]
  },

  {
    id: "strawberry",
    emoji: "🍓",
    name: "Strawberry",
    baseCost: 30,
    baseSell: 70,
    growSeconds: 160,
    xp: 14,
    levelRequired: 4,
    bestSeasons: ["Spring"]
  },

  {
    id: "blueberry",
    emoji: "🫐",
    name: "Blueberry",
    baseCost: 40,
    baseSell: 90,
    growSeconds: 200,
    xp: 18,
    levelRequired: 4,
    bestSeasons: ["Summer"]
  },

  {
    id: "pumpkin",
    emoji: "🎃",
    name: "Pumpkin",
    baseCost: 60,
    baseSell: 140,
    growSeconds: 260,
    xp: 25,
    levelRequired: 5,
    bestSeasons: ["Fall"]
  },

  {
    id: "watermelon",
    emoji: "🍉",
    name: "Watermelon",
    baseCost: 70,
    baseSell: 170,
    growSeconds: 320,
    xp: 28,
    levelRequired: 5,
    bestSeasons: ["Summer"]
  },

  {
    id: "grapes",
    emoji: "🍇",
    name: "Grapes",
    baseCost: 90,
    baseSell: 220,
    growSeconds: 420,
    xp: 35,
    levelRequired: 6,
    bestSeasons: ["Fall"]
  },

  {
    id: "apple",
    emoji: "🍎",
    name: "Apple",
    baseCost: 110,
    baseSell: 270,
    growSeconds: 500,
    xp: 42,
    levelRequired: 6,
    bestSeasons: ["Fall"]
  },

  {
    id: "banana",
    emoji: "🍌",
    name: "Banana",
    baseCost: 140,
    baseSell: 340,
    growSeconds: 620,
    xp: 50,
    levelRequired: 7,
    bestSeasons: ["Summer"]
  },

  {
    id: "pineapple",
    emoji: "🍍",
    name: "Pineapple",
    baseCost: 180,
    baseSell: 450,
    growSeconds: 760,
    xp: 65,
    levelRequired: 8,
    bestSeasons: ["Summer"]
  },

  {
    id: "coconut",
    emoji: "🥥",
    name: "Coconut",
    baseCost: 240,
    baseSell: 620,
    growSeconds: 900,
    xp: 80,
    levelRequired: 9,
    bestSeasons: ["Summer"]
  },

  {
    id: "pepper",
    emoji: "🌶️",
    name: "Pepper",
    baseCost: 300,
    baseSell: 820,
    growSeconds: 1050,
    xp: 100,
    levelRequired: 10,
    bestSeasons: ["Summer"]
  },

  {
    id: "golden_apple",
    emoji: "✨🍎",
    name: "Golden Apple",
    baseCost: 500,
    baseSell: 1500,
    growSeconds: 1600,
    xp: 180,
    levelRequired: 12,
    bestSeasons: ["Fall"]
  }

];

const LEVEL_XP = [0,10,30,70,130,220,350];

const GRID_SIZE = 10;

const farmEl = document.getElementById("farm");

const coinsEl = document.getElementById("coins");
const levelEl = document.getElementById("level");
const xpEl = document.getElementById("xp");
const xpNextEl = document.getElementById("xpNext");
const seasonEl = document.getElementById("season");
const dayEl = document.getElementById("day");
const weatherEl = document.getElementById("weather");

const marketInfoEl = document.getElementById("marketInfo");
const townInfoEl = document.getElementById("townInfo");
const machineInfoEl = document.getElementById("machineInfo");

const expandBtn = document.getElementById("expandBtn");
const resetBtn = document.getElementById("resetBtn");

const seedSelectEl = document.getElementById("seedSelect");

const msgEl = document.getElementById("msg");

let tileElements = [];

let state = {
  coins: 50,
  xp: 0,
  level: 1,

  unlockedSize: 3,

  day: 1,
  seasonIndex: 0,
  weatherIndex: 0,

  lastDayTick: now(),

  tiles: [],
  soil: [],

  machinery: {
    tractor: 0,
    harvester: 0
  },

  market: {
    prices: {},
    demand: {}
  },

  town: {
    population: 10,
    prosperity: 1
  }
};

function now() {
  return Math.floor(Date.now()/1000);
}

function currentSeason() {
  return SEASONS[state.seasonIndex];
}

function currentWeather() {
  return WEATHER_TYPES[state.weatherIndex];
}

function cropById(id) {
  return CROPS.find(c => c.id === id);
}

function xpForLevel(level) {
  return LEVEL_XP[level] ??
    LEVEL_XP[LEVEL_XP.length-1] + level * 180;
}

function setMessage(text) {
  msgEl.textContent = text;
}

function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function load() {
  const raw = localStorage.getItem(SAVE_KEY);

  if (!raw) return;

  try {
    const data = JSON.parse(raw);
    state = Object.assign(state, data);
  } catch {}
}

function initTiles() {

  if (!state.tiles.length) {

    state.tiles = Array.from(
      { length: GRID_SIZE * GRID_SIZE },
      () => ({
        cropId: null,
        plantedAt: 0,
        dead: false,
        quality: "normal",
        lastCropId: null
      })
    );
  }

  if (!state.soil.length) {

    state.soil = Array.from(
      { length: GRID_SIZE * GRID_SIZE },
      () => .7
    );
  }
}

function randomChoice(arr) {
  return arr[Math.floor(Math.random()*arr.length)];
}

function updateWeather() {

  const season = currentSeason();

  let pool;

  if (season === "Spring") {
    pool = ["Sunny","Rain","Rain","Cloudy"];
  }

  else if (season === "Summer") {
    pool = ["Sunny","Sunny","Drought","Storm"];
  }

  else if (season === "Fall") {
    pool = ["Sunny","Rain","Cloudy","Storm"];
  }

  else {
    pool = ["Snow","Cloudy","Sunny"];
  }

  const chosen = randomChoice(pool);

  state.weatherIndex = WEATHER_TYPES.indexOf(chosen);
}

function updateMarket() {

  CROPS.forEach(crop => {

    let price = crop.baseSell;

    if (crop.bestSeasons.includes(currentSeason())) {
      price *= 1.2;
    }

    if (currentWeather() === "Drought") {
      price *= 1.15;
    }

    if (currentWeather() === "Rain") {
      price *= .95;
    }

    const demand = state.market.demand[crop.id] || 0;

    price *= Math.max(.7, 1.2 - demand * .03);

    price *= .9 + Math.random() * .25;

    state.market.prices[crop.id] = Math.round(price);
  });
}

function advanceDay() {

  state.day++;

  if (state.day > 30) {
    state.day = 1;
    state.seasonIndex =
      (state.seasonIndex + 1) % SEASONS.length;
  }

  updateWeather();
  updateMarket();

  for (let i=0;i<state.soil.length;i++) {
    state.soil[i] =
      Math.min(1, state.soil[i] + .01);
  }

  maybeDisaster();

  state.town.population =
    10 + state.level * 5 +
    state.machinery.harvester * 10;

  state.town.prosperity =
    state.level +
    state.machinery.harvester;
}

function maybeDisaster() {

  const roll = Math.random();

  if (roll < .015) {

    let damaged = 0;

    state.tiles.forEach(tile => {

      if (tile.cropId && Math.random() < .05) {
        tile.dead = true;
        damaged++;
      }

    });

    if (damaged > 0) {
      setMessage("Storm damaged crops!");
    }
  }
}

function getTileState(tile, index) {

  if (!tile.cropId) {
    return {
      stage: "empty"
    };
  }

  const crop = cropById(tile.cropId);

  const elapsed = now() - tile.plantedAt;

  const growTime =
    Math.max(
      5,
      crop.growSeconds *
      (1 - state.machinery.tractor * .03)
    );

  const remaining = growTime - elapsed;

  if (elapsed > growTime * 4 || tile.dead) {
    return {
      stage: "dead",
      crop
    };
  }

  if (remaining <= 0) {
    return {
      stage: "ready",
      crop
    };
  }

  if (elapsed > growTime * .5) {
    return {
      stage: "growing",
      crop,
      remaining
    };
  }

  return {
    stage: "planted",
    crop,
    remaining
  };
}

function qualityRoll() {

  const r = Math.random();

  if (r > .995) return "golden";
  if (r > .95) return "excellent";
  if (r > .75) return "good";

  return "normal";
}

function qualityMultiplier(q) {

  if (q === "good") return 1.2;
  if (q === "excellent") return 1.6;
  if (q === "golden") return 3;

  return 1;
}

function isLocked(index) {

  const row = Math.floor(index / GRID_SIZE);
  const col = index % GRID_SIZE;

  return (
    row >= state.unlockedSize ||
    col >= state.unlockedSize
  );
}

function plantSingle(index, crop) {

  const tile = state.tiles[index];

  if (tile.cropId) return false;

  tile.cropId = crop.id;
  tile.plantedAt = now();
  tile.dead = false;
  tile.quality = qualityRoll();

  if (tile.lastCropId === crop.id) {
    state.soil[index] =
      Math.max(.2, state.soil[index] - .05);
  }

  else {
    state.soil[index] =
      Math.min(1, state.soil[index] + .03);
  }

  tile.lastCropId = crop.id;

  return true;
}

function tractorPlant(index, crop) {

  const positions = [
    index,
    index + 1,
    index + GRID_SIZE
  ];

  let planted = 0;

  positions.forEach(i => {

    if (!state.tiles[i]) return;
    if (isLocked(i)) return;

    const success = plantSingle(i, crop);

    if (success) planted++;

  });

  return planted;
}

function plant(index) {

  const crop = cropById(seedSelectEl.value);

  if (state.level < crop.levelRequired) {
    return setMessage("Requires level " + crop.levelRequired);
  }

  const cost = crop.baseCost;

  if (state.coins < cost) {
    return setMessage("Not enough coins");
  }

  let planted = 0;

  if (state.machinery.tractor > 0) {

    planted = tractorPlant(index, crop);

    state.coins -= planted * cost;
  }

  else {

    const success = plantSingle(index, crop);

    if (success) {
      planted = 1;
      state.coins -= cost;
    }
  }

  if (planted > 0) {
    setMessage("Planted " + planted + " " + crop.name);
  }

  save();
  render();
}

function harvest(index) {

  const tile = state.tiles[index];

  const info = getTileState(tile, index);

  if (info.stage !== "ready") return;

  const crop = info.crop;

  let value =
    state.market.prices[crop.id] ||
    crop.baseSell;

  value *= (.5 + state.soil[index]);

  value *= 1 + state.machinery.harvester * .05;

  value *= qualityMultiplier(tile.quality);

  value = Math.round(value);

  state.coins += value;
  state.xp += crop.xp;

  state.market.demand[crop.id] =
    (state.market.demand[crop.id] || 0) + 1;

  while (
    state.level < 99 &&
    state.xp >= xpForLevel(state.level)
  ) {
    state.level++;
    setMessage(
      "Level up! New crops unlocked at level " +
      state.level
    );

    initSeedSelect();
  }

  tile.cropId = null;
  tile.plantedAt = 0;
  tile.dead = false;

  save();
  render();
}

function clearDead(index) {

  const tile = state.tiles[index];

  tile.cropId = null;
  tile.dead = false;

  render();
  save();
}

function tileClick(index) {

  if (isLocked(index)) {
    return setMessage("Expand farm first.");
  }

  const tile = state.tiles[index];

  const info = getTileState(tile, index);

  if (info.stage === "empty") {
    return plant(index);
  }

  if (info.stage === "ready") {
    return harvest(index);
  }

  if (info.stage === "dead") {
    return clearDead(index);
  }

  setMessage(
    info.crop.name +
    " — " +
    Math.ceil(info.remaining) +
    "s"
  );
}

function createFarm() {

  farmEl.innerHTML = "";
  tileElements = [];

  for (let i=0;i<GRID_SIZE*GRID_SIZE;i++) {

    const div = document.createElement("div");

    div.className = "tile";

    div.addEventListener(
      "click",
      () => tileClick(i)
    );

    farmEl.appendChild(div);

    tileElements.push(div);
  }
}

function renderTiles() {

  for (let i=0;i<tileElements.length;i++) {

    const div = tileElements[i];

    if (isLocked(i)) {

      div.className = "tile locked";
      div.textContent = "🔒";

      continue;
    }

    const tile = state.tiles[i];

    const info = getTileState(tile, i);

    div.className =
      "tile " +
      info.stage +
      " " +
      (tile.quality || "");

    if (info.stage === "empty") {
      div.textContent = "";
    }

    else if (info.stage === "planted") {
      div.textContent = "🌱";
    }

    else if (info.stage === "growing") {
      div.textContent = info.crop.emoji;
    }

    else if (info.stage === "ready") {
      div.textContent = "✨";
    }

    else if (info.stage === "dead") {
      div.textContent = "💀";
    }
  }
}

function renderUI() {

  coinsEl.textContent = state.coins;

  levelEl.textContent = state.level;

  const currentLevelXP =
    xpForLevel(state.level - 1);

  const nextLevelXP =
    xpForLevel(state.level);

  xpEl.textContent =
    state.xp - currentLevelXP;

  xpNextEl.textContent =
    nextLevelXP - currentLevelXP;

  seasonEl.textContent =
    currentSeason();

  dayEl.textContent =
    state.day;

  weatherEl.textContent =
    currentWeather();

  if (state.unlockedSize >= 10) {

    expandBtn.disabled = true;
    expandBtn.textContent = "Farm Maxed";
  }

  else {

    const cost =
      state.unlockedSize === 6
      ? 500
      : 2000;

    expandBtn.textContent =
      "Expand (" + cost + "c)";

    expandBtn.disabled =
      state.coins < cost;
  }

  let marketHTML =
    "<b>Market</b><br>";

  CROPS.forEach(crop => {

    marketHTML +=
      crop.emoji +
      " " +
      crop.name +
      ": " +
      (state.market.prices[crop.id] || crop.baseSell) +
      "c<br>";
  });

  marketInfoEl.innerHTML = marketHTML;

  townInfoEl.innerHTML =
    "<b>Town</b><br>" +
    "Population: " +
    state.town.population +
    "<br>" +
    "Prosperity: " +
    state.town.prosperity;

  machineInfoEl.innerHTML =
    "<b>Machinery</b><br>" +
    "🚜 Tractor Lv" +
    state.machinery.tractor +
    "<br>" +
    "🌾 Harvester Lv" +
    state.machinery.harvester +
    "<br><br>" +
    "<button id='tractorBtn'>Upgrade Tractor</button><br>" +
    "<button id='harvesterBtn'>Upgrade Harvester</button>";

  setTimeout(() => {

    document
      .getElementById("tractorBtn")
      ?.addEventListener("click", () => {

        const cost =
          250 *
          (state.machinery.tractor + 1);

        if (state.coins < cost) {
          return setMessage("Need " + cost);
        }

        state.coins -= cost;
        state.machinery.tractor++;

        renderUI();
        save();
      });

    document
      .getElementById("harvesterBtn")
      ?.addEventListener("click", () => {

        const cost =
          400 *
          (state.machinery.harvester + 1);

        if (state.coins < cost) {
          return setMessage("Need " + cost);
        }

        state.coins -= cost;
        state.machinery.harvester++;

        renderUI();
        save();
      });

  },0);

}

function render() {
  renderTiles();
  renderUI();
}

function tick() {

  const elapsed =
    now() - state.lastDayTick;

  if (elapsed >= 30) {

    const skipped =
      Math.floor(elapsed / 30);

    for (let i=0;i<skipped;i++) {
      advanceDay();
    }

    state.lastDayTick = now();

    render();
    save();
  }

  renderTiles();
}

expandBtn.addEventListener("click", () => {

  if (state.unlockedSize >= 10) return;

  const cost =
    state.unlockedSize === 6
    ? 500
    : 2000;

  if (state.coins < cost) {
    return setMessage("Need " + cost);
  }

  state.coins -= cost;

  state.unlockedSize += 2;

  setMessage(
    "Farm expanded to " +
    state.unlockedSize +
    "x" +
    state.unlockedSize
  );

  save();
  render();
});

resetBtn.addEventListener("click", () => {

  if (!confirm("Reset save?")) return;

  localStorage.removeItem(SAVE_KEY);

  location.reload();
});

function initSeedSelect() {

  seedSelectEl.innerHTML = "";

  const unlockedCrops =
    CROPS.filter(
      crop => state.level >= crop.levelRequired
    );

  unlockedCrops.forEach(crop => {

    const opt =
      document.createElement("option");

    opt.value = crop.id;

    opt.textContent =
      crop.emoji +
      " " +
      crop.name;

    seedSelectEl.appendChild(opt);

  });

}

load();
initTiles();
createFarm();
initSeedSelect();

updateWeather();
updateMarket();

render();

setMessage(
  "Manage crops, weather, soil, market, and machinery."
);

setInterval(tick, 1000);

</script>

</body>
</html>
