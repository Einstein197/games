<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏭 Feed Mill</title>
  <link rel="stylesheet" href="farm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; } /* only the outer page (index.html) should ever scroll */
    body { 
      background: transparent;
      color: #eee; 
      font-family: Arial, sans-serif; 
      padding: 0;
      margin: 0;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0;
      background: linear-gradient(145deg, #1a1a2a, #2a2a3d);
      border: 2px solid #4a4a6a;
      border-radius: 16px;
      padding: 30px;
      box-shadow: none;
    }
    h1 { color: #66ddff; text-align: center; }
    .header p { color: #8888aa; text-align: center; margin: 8px 0 20px 0; }
    .silo-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
    .stat-label { font-size: 12px; color: #8888aa; text-transform: uppercase; letter-spacing: 1px; }
    .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
    .recipe-card { background: linear-gradient(145deg, #1a1a2a, #0a0a1a); border: 2px solid #3a3a5a; border-radius: 12px; padding: 15px; text-align: center; transition: all 0.3s ease; position: relative; }
    .recipe-card:hover { transform: translateY(-5px); border-color: #66ddff; box-shadow: 0 6px 20px rgba(102, 221, 255, 0.2); }
    .recipe-icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .recipe-name { font-size: 16px; font-weight: bold; color: #66ddff; }
    .recipe-requires { font-size: 12px; color: #ffaa44; margin-top: 4px; }
    .recipe-output { font-size: 14px; color: #66ff66; margin-top: 4px; }
    .recipe-stock { font-size: 13px; color: #88ccff; margin-top: 8px; }
    .recipe-stock span { color: #ffd700; font-weight: bold; }
    .process-btn { background: #2a4a7c; color: white; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
    .process-btn:hover { background: #3a5a9c; }
    .qty-row { display: flex; gap: 6px; margin-top: 10px; }
    .qty-input {
      flex: 1;
      min-width: 0;
      background: rgba(0,0,0,0.35);
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #eee;
      text-align: center;
      padding: 6px 4px;
      font-size: 13px;
    }
    .qty-input:focus { outline: none; border-color: #66ddff; }
    .qty-max-btn {
      background: #3a3a5a;
      color: #ffd700;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .qty-max-btn:hover { background: #4a4a7a; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; font-size: 14px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .btn.send { background: linear-gradient(145deg, #2a7c4a, #1a5a3a); color: #66ff66; }
    .btn.send:hover { background: linear-gradient(145deg, #3a9c5a, #2a7c4a); }
    .btn.upgrade { background: linear-gradient(145deg, #7c6a2a, #5a4a1a); color: #ffdd66; }
    .btn.upgrade:hover { background: linear-gradient(145deg, #9c8a3a, #7c6a2a); }
    
    /* Popup overlay */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .popup-overlay.show {
      display: flex;
    }
    .popup-overlay.anchored {
      background: transparent;
      pointer-events: none;
    }
    .popup-box {
      background: linear-gradient(145deg, #1a1a2a, #2a2a3d);
      border: 2px solid #4a4a6a;
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      animation: popIn 0.3s ease;
      pointer-events: auto;
    }
    .popup-box.anchored {
      position: fixed;
      margin: 0;
      max-width: 280px;
      width: max-content;
      padding: 18px 20px;
      text-align: left;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .popup-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 15px;
    }
    .popup-box.anchored .popup-icon {
      font-size: 28px;
      display: inline-block;
      margin: 0 8px 0 0;
      vertical-align: middle;
    }
    .popup-message {
      color: #eee;
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .popup-box.anchored .popup-message {
      display: inline-block;
      vertical-align: middle;
      font-size: 14px;
      margin-bottom: 12px;
      width: calc(100% - 44px);
    }
    .popup-btn {
      background: linear-gradient(145deg, #2a4a7c, #1a3a5a);
      color: #66ddff;
      border: none;
      padding: 10px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .popup-box.anchored .popup-btn {
      display: block;
      width: 100%;
      padding: 6px 16px;
      font-size: 13px;
    }
    .popup-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(102, 221, 255, 0.3);
    }
    .popup-btn.error {
      background: linear-gradient(145deg, #7c2a2a, #5a1a1a);
      color: #ff6666;
    }
    .popup-btn.error:hover {
      box-shadow: 0 4px 15px rgba(255, 102, 102, 0.3);
    }
    .popup-btn.success {
      background: linear-gradient(145deg, #2a7c4a, #1a5a3a);
      color: #66ff66;
    }
    .popup-btn.success:hover {
      box-shadow: 0 4px 15px rgba(102, 255, 102, 0.3);
    }
    .popup-btn.info {
      background: linear-gradient(145deg, #2a4a7c, #1a3a5a);
      color: #66ddff;
    }
    .popup-btn.info:hover {
      box-shadow: 0 4px 15px rgba(102, 221, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏭 Feed Mill</h1>
    </div>
    
    <div class="silo-stats">
      <div><div class="stat-value" id="wheatStock">0</div><div class="stat-label">🌾 Wheat</div></div>
      <div><div class="stat-value" id="cornStock">0</div><div class="stat-label">🌽 Corn</div></div>
      <div><div class="stat-value" id="millLevel">Lv 1</div><div class="stat-label">Mill Level</div></div>
    </div>
    
    <div class="recipe-grid">
      <div class="recipe-card" id="cardHay">
        <span class="recipe-icon">🌾</span>
        <div class="recipe-name">Hay <span id="hayStock">0</span></div>
        <div class="recipe-requires">Requires: 5 Wheat from Silo</div>
        <div class="recipe-output">Produces: 10 Hay</div>
        <div class="qty-row">
          <input type="number" class="qty-input" id="qty_hay" min="1" value="1">
          <button class="qty-max-btn" onclick="setMaxQty('hay')">Max</button>
        </div>
        <button class="process-btn" onclick="processFeed('hay', this)">Process Hay</button>
      </div>
      
      <div class="recipe-card" id="cardGrain">
        <span class="recipe-icon">🌽</span>
        <div class="recipe-name">Grain <span id="grainStock">0</span></div>
        <div class="recipe-requires">Requires: 3 Corn from Silo</div>
        <div class="recipe-output">Produces: 8 Grain</div>
        <div class="qty-row">
          <input type="number" class="qty-input" id="qty_grain" min="1" value="1">
          <button class="qty-max-btn" onclick="setMaxQty('grain')">Max</button>
        </div>
        <button class="process-btn" onclick="processFeed('grain', this)">Process Grain</button>
      </div>
      
      <div class="recipe-card" id="cardMixed">
        <span class="recipe-icon">🍲</span>
        <div class="recipe-name">Mixed Feed <span id="mixedStock">0</span></div>
        <div class="recipe-requires">Requires: 2 Hay + 2 Grain</div>
        <div class="recipe-output">Produces: 6 Mixed Feed</div>
        <div class="qty-row">
          <input type="number" class="qty-input" id="qty_mixed" min="1" value="1">
          <button class="qty-max-btn" onclick="setMaxQty('mixed')">Max</button>
        </div>
        <button class="process-btn" onclick="processFeed('mixed', this)">Process Mixed</button>
      </div>
      
      <div class="recipe-card" id="cardPellets">
        <span class="recipe-icon">🔵</span>
        <div class="recipe-name">Pellets <span id="pelletsStock">0</span></div>
        <div class="recipe-requires">Requires: 4 Mixed Feed</div>
        <div class="recipe-output">Produces: 4 Pellets</div>
        <div class="qty-row">
          <input type="number" class="qty-input" id="qty_pellets" min="1" value="1">
          <button class="qty-max-btn" onclick="setMaxQty('pellets')">Max</button>
        </div>
        <button class="process-btn" onclick="processFeed('pellets', this)">Process Pellets</button>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn send" onclick="sendToBarn()">📦 Send Feed to Barn</button>
      <button class="btn upgrade" onclick="upgradeMill()">⬆️ Upgrade Mill</button>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box" id="popupBox">
      <span class="popup-icon" id="popupIcon">🏭</span>
      <div class="popup-message" id="popupMessage">Hello!</div>
      <button class="popup-btn" id="popupBtn" onclick="closePopup()">OK</button>
    </div>
  </div>
  
  <script>
    const SAVE_KEY = "krypton_simfarm_ultimate";
    
    let state = {
      coins: 0,
      feedmill: {
        level: 1,
        feed: { hay: 0, grain: 0, mixed: 0, pellets: 0 }
      }
    };

    let sharedSilo = { wheat: 0, corn: 0 };

    const FEED_ICONS = { hay: '🌾', grain: '🌽', mixed: '🍲', pellets: '🔵' };
    const FEED_CARD_IDS = { hay: 'cardHay', grain: 'cardGrain', mixed: 'cardMixed', pellets: 'cardPellets' };

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) {
          state.coins = 100;
          state.feedmill = {
            level: 1,
            feed: { hay: 0, grain: 0, mixed: 0, pellets: 0 }
          };
          sharedSilo.wheat = 0;
          sharedSilo.corn = 0;
          return;
        }
        
        const data = JSON.parse(raw);
        state.coins = data.coins || 100;
        
        if (data.feedmill) {
          state.feedmill.level = data.feedmill.level || 1;
          state.feedmill.feed = {
            hay: data.feedmill.feed?.hay || 0,
            grain: data.feedmill.feed?.grain || 0,
            mixed: data.feedmill.feed?.mixed || 0,
            pellets: data.feedmill.feed?.pellets || 0
          };
        }
        
        if (data.farm && data.farm.silo && data.farm.silo.stored) {
          sharedSilo.wheat = data.farm.silo.stored.wheat || 0;
          sharedSilo.corn = data.farm.silo.stored.corn || 0;
        } else if (data.silo && data.silo.stored) {
          sharedSilo.wheat = data.silo.stored.wheat || 0;
          sharedSilo.corn = data.silo.stored.corn || 0;
        } else {
          sharedSilo.wheat = 0;
          sharedSilo.corn = 0;
        }
        
        console.log('💾 Feedmill loaded! Coins:', state.coins);
        console.log('🌾 Shared Silo - Wheat:', sharedSilo.wheat, 'Corn:', sharedSilo.corn);
      } catch (e) {
        console.log('Load failed:', e);
        state.coins = 100;
        state.feedmill = {
          level: 1,
          feed: { hay: 0, grain: 0, mixed: 0, pellets: 0 }
        };
        sharedSilo.wheat = 0;
        sharedSilo.corn = 0;
      }
    }

    function save() {
      try {
        let mainData = {};
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (raw) mainData = JSON.parse(raw);
        } catch(e) {}
        
        mainData.coins = state.coins;
        
        mainData.feedmill = {
          level: state.feedmill.level || 1,
          feed: {
            hay: state.feedmill.feed.hay || 0,
            grain: state.feedmill.feed.grain || 0,
            mixed: state.feedmill.feed.mixed || 0,
            pellets: state.feedmill.feed.pellets || 0
          }
        };
        
        localStorage.setItem(SAVE_KEY, JSON.stringify(mainData));
        console.log('💾 Feedmill saved! Coins:', state.coins);
      } catch (e) {
        console.log('Save failed:', e);
      }
    }

    function syncCoinsToParent() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ 
          type: 'coin-update', 
          coins: state.coins 
        }, '*');
        console.log('💰 Feedmill synced coins to parent:', state.coins);
      }
    }

    function showPopup(message, icon = '🏭', btnType = 'success', anchorEl = null) {
      const overlay = document.getElementById('popupOverlay');
      const box = document.getElementById('popupBox');
      const msgEl = document.getElementById('popupMessage');
      const iconEl = document.getElementById('popupIcon');
      const btnEl = document.getElementById('popupBtn');
      
      msgEl.textContent = message;
      iconEl.textContent = icon;
      
      btnEl.className = 'popup-btn';
      if (btnType === 'error') {
        btnEl.classList.add('error');
      } else if (btnType === 'info') {
        btnEl.classList.add('info');
      } else {
        btnEl.classList.add('success');
      }
      
      if (anchorEl) {
        overlay.classList.add('anchored');
        box.classList.add('anchored');
        positionAnchoredPopup(box, anchorEl);
      } else {
        overlay.classList.remove('anchored');
        box.classList.remove('anchored');
        box.style.top = '';
        box.style.left = '';
      }
      
      overlay.classList.add('show');
    }

    function positionAnchoredPopup(box, anchorEl) {
      const rect = anchorEl.getBoundingClientRect();
      box.style.visibility = 'hidden';
      box.style.left = '0px';
      box.style.top = '0px';
      const boxRect = box.getBoundingClientRect();

      let left = rect.left + (rect.width / 2) - (boxRect.width / 2);
      let top = rect.bottom + 10;

      if (top + boxRect.height > window.innerHeight - 10) {
        top = rect.top - boxRect.height - 10;
      }
      left = Math.max(10, Math.min(left, window.innerWidth - boxRect.width - 10));
      top = Math.max(10, top);

      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.visibility = 'visible';
    }
    
    function closePopup() {
      document.getElementById('popupOverlay').classList.remove('show');
    }

    document.getElementById('popupOverlay').addEventListener('click', function(e) {
      if (e.target === this && this.classList.contains('anchored')) {
        closePopup();
      }
    });

    function render() {
      document.getElementById('wheatStock').textContent = sharedSilo.wheat || 0;
      document.getElementById('cornStock').textContent = sharedSilo.corn || 0;
      document.getElementById('millLevel').textContent = 'Lv ' + (state.feedmill.level || 1);
      
      document.getElementById('hayStock').textContent = state.feedmill.feed.hay || 0;
      document.getElementById('grainStock').textContent = state.feedmill.feed.grain || 0;
      document.getElementById('mixedStock').textContent = state.feedmill.feed.mixed || 0;
      document.getElementById('pelletsStock').textContent = state.feedmill.feed.pellets || 0;
      
      setTimeout(resizeIframe, 100);
    }
    
    function resizeIframe() {
      if (window.parent && window.parent !== window) {
        const height = document.documentElement.scrollHeight;
        window.parent.postMessage({ 
          type: 'resize-iframe', 
          height: height 
        }, '*');
      }
    }
    
    const RECIPES = {
      hay: { requires: { wheat: 5 }, produces: { hay: 10 } },
      grain: { requires: { corn: 3 }, produces: { grain: 8 } },
      mixed: { requires: { hay: 2, grain: 2 }, produces: { mixed: 6 } },
      pellets: { requires: { mixed: 4 }, produces: { pellets: 4 } }
    };

    function getAvailableAmount(ingredient) {
      if (ingredient === 'wheat' || ingredient === 'corn') {
        return sharedSilo[ingredient] || 0;
      }
      return state.feedmill.feed[ingredient] || 0;
    }

    function consumeIngredient(ingredient, amount) {
      if (ingredient === 'wheat' || ingredient === 'corn') {
        sharedSilo[ingredient] = (sharedSilo[ingredient] || 0) - amount;
      } else {
        state.feedmill.feed[ingredient] = (state.feedmill.feed[ingredient] || 0) - amount;
      }
    }

    function setMaxQty(type) {
      const recipe = RECIPES[type];
      if (!recipe) return;
      let max = Infinity;
      for (const [ingredient, amount] of Object.entries(recipe.requires)) {
        const available = getAvailableAmount(ingredient);
        max = Math.min(max, Math.floor(available / amount));
      }
      if (!isFinite(max) || max < 0) max = 0;
      const input = document.getElementById('qty_' + type);
      if (input) input.value = Math.max(max, 1);
    }

    function processFeed(type, btnEl) {
      const recipe = RECIPES[type];
      if (!recipe) return;

      const qtyInput = document.getElementById('qty_' + type);
      let qty = qtyInput ? parseInt(qtyInput.value, 10) : 1;
      if (!qty || qty < 1) qty = 1;

      const card = (btnEl && btnEl.closest('.recipe-card'))
        || document.getElementById(FEED_CARD_IDS[type]);
      const icon = FEED_ICONS[type] || '🏭';
      
      for (const [ingredient, amount] of Object.entries(recipe.requires)) {
        const needed = amount * qty;
        const available = getAvailableAmount(ingredient);
        if (available < needed) {
          showPopup('❌ Not enough ' + ingredient + '! Need ' + needed + ' for x' + qty + ', have ' + available + '.', icon, 'error', card);
          return;
        }
      }
      
      for (const [ingredient, amount] of Object.entries(recipe.requires)) {
        consumeIngredient(ingredient, amount * qty);
      }
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'silo-use',
          wheat: sharedSilo.wheat || 0,
          corn: sharedSilo.corn || 0
        }, '*');
      }
      
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const mainData = JSON.parse(raw);
          if (!mainData.farm) mainData.farm = {};
          if (!mainData.farm.silo) mainData.farm.silo = {};
          if (!mainData.farm.silo.stored) mainData.farm.silo.stored = {};
          mainData.farm.silo.stored.wheat = sharedSilo.wheat || 0;
          mainData.farm.silo.stored.corn = sharedSilo.corn || 0;
          localStorage.setItem(SAVE_KEY, JSON.stringify(mainData));
        }
      } catch(e) {}
      
      let producedAmt = 0;
      for (const [feedType, amount] of Object.entries(recipe.produces)) {
        const total = amount * qty;
        state.feedmill.feed[feedType] = (state.feedmill.feed[feedType] || 0) + total;
        producedAmt = total;
      }
      
      showPopup('✅ Processed x' + qty + ' ' + type + '! Produced ' + producedAmt + ' ' + type + '.', icon, 'success', card);
      save();
      render();
    }
    
    function sendToBarn() {
      const total = Object.values(state.feedmill.feed).reduce((a, b) => a + b, 0);
      if (total === 0) {
        showPopup('❌ No feed to send! Process some first.', '❌', 'error');
        return;
      }
      
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'feed-update',
          hay: state.feedmill.feed.hay || 0,
          grain: state.feedmill.feed.grain || 0,
          mixed: state.feedmill.feed.mixed || 0,
          pellets: state.feedmill.feed.pellets || 0
        }, '*');
      }
      
      showPopup('📦 Sent ' + total + ' feed to the Barn!', '📦', 'success');
      
      state.feedmill.feed = { hay: 0, grain: 0, mixed: 0, pellets: 0 };
      save();
      render();
    }
    
    function upgradeMill() {
      const cost = (state.feedmill.level || 1) * 500;
      
      if (state.coins < cost) {
        showPopup('❌ Not enough coins! Need ' + cost + ' coins to upgrade to Lv ' + (state.feedmill.level + 1) + '. You have ' + state.coins + '.', '❌', 'error');
        return;
      }
      
      state.coins -= cost;
      state.feedmill.level = (state.feedmill.level || 1) + 1;
      
      showPopup('⬆️ Mill upgraded to Lv ' + state.feedmill.level + '!', '⬆️', 'success');
      syncCoinsToParent();
      save();
      render();
    }
    
    window.addEventListener('message', function(event) {
      console.log('🏭 Feedmill received message:', event.data);
      
      if (event.data && event.data.type === 'request-resize') {
        resizeIframe();
      }
      
      if (event.data && event.data.type === 'coin-update') {
        if (event.data.coins !== undefined) {
          state.coins = event.data.coins;
          save();
          render();
          console.log('💰 Feedmill coins updated from parent:', state.coins);
        }
      }
      
      if (event.data && event.data.type === 'silo-update') {
        if (event.data.wheat !== undefined) {
          sharedSilo.wheat = event.data.wheat;
        }
        if (event.data.corn !== undefined) {
          sharedSilo.corn = event.data.corn;
        }
        render();
        console.log('🌾 Shared Silo updated - Wheat:', sharedSilo.wheat, 'Corn:', sharedSilo.corn);
      }
      
      if (event.data && event.data.type === 'silo-data') {
        if (event.data.wheat !== undefined) {
          sharedSilo.wheat += event.data.wheat;
        }
        if (event.data.corn !== undefined) {
          sharedSilo.corn += event.data.corn;
        }
        showPopup('🌾 Received crops from Silo! Wheat: ' + (event.data.wheat || 0) + ', Corn: ' + (event.data.corn || 0), '🌾', 'success');
        save();
        render();
        console.log('🌾 Silo received - Wheat:', sharedSilo.wheat, 'Corn:', sharedSilo.corn);
      }
      
      if (event.data && event.data.type === 'reset-game') {
        localStorage.removeItem(SAVE_KEY);
        location.reload();
      }
    });
    
    window.state = state;
    window.save = save;
    window.load = load;
    window.render = render;
    window.syncCoinsToParent = syncCoinsToParent;
    window.sharedSilo = sharedSilo;
    window.processFeed = processFeed;
    window.sendToBarn = sendToBarn;
    window.upgradeMill = upgradeMill;
    window.showPopup = showPopup;
    window.closePopup = closePopup;
    
    load();
    render();
    resizeIframe();
    
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'request-silo' }, '*');
    }

    setInterval(() => {
      window.parent.postMessage({ type: 'request-silo' }, '*');
    }, 30000);
    
    setTimeout(function() {
      syncCoinsToParent();
      console.log('🏭 Feedmill initialized with coins:', state.coins);
      console.log('🌾 Shared Silo has - Wheat:', sharedSilo.wheat, 'Corn:', sharedSilo.corn);
    }, 500);
    
    setInterval(save, 30000);
    
    // Safety net: re-report height every couple seconds regardless of what
    // triggered a content change. ResizeObserver + explicit calls after
    // render() should normally catch everything, but relying on tracking
    // every single trigger point is fragile — this guarantees the iframe
    // self-corrects on its own if content was ever clipped.
    setInterval(resizeIframe, 2000);
    
    if (window.ResizeObserver) {
      const observer = new ResizeObserver(resizeIframe);
      observer.observe(document.body);
    }

    (function() {
      var lastY = null;
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) lastY = e.touches[0].clientY;
      }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        if (lastY === null || e.touches.length !== 1) return;
        var currentY = e.touches[0].clientY;
        var deltaY = lastY - currentY;
        lastY = currentY;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'touch-scroll', deltaY: deltaY }, '*');
        }
      }, { passive: true });
      document.addEventListener('touchend', function() { lastY = null; }, { passive: true });
    })();
  </script>
</body>
