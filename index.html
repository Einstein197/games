<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krypton Arcade</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(to bottom, #ff7b00, #3b0b5c);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 36px;
      text-shadow: 0 0 18px rgba(0,0,0,0.7);
    }
    p.subtitle {
      margin: 0 0 20px;
      opacity: 0.9;
    }
    .ad-wrap {
      margin: 16px 0 24px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .grid {
      width: 100%;
      max-width: 900px;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(0,0,0,0.35);
      border-radius: 18px;
      padding: 16px 12px 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 22px rgba(0,0,0,0.7);
      background: rgba(0,0,0,0.5);
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 10px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 12px;
      opacity: 0.8;
    }
    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .icon-wrap { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
  <h1>Krypton Arcade</h1>
  <p class="subtitle">Tap a game to launch it in a separate window. Main page stays open with rewards.</p>

  <div class="ad-wrap">
    <iframe
      data-aa="2434032"
      src="https://acceptable.a-ads.com/2434032?size=728x90"
      style="border:0; width:728px; max-width:100%; height:90px; display:block;"
      loading="lazy">
    </iframe>
  </div>

  <div class="grid">
    <!-- Snake -->
    <div class="card" onclick="openGame('snake.html')">
      <div class="icon-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="snakeGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb366"/>
              <stop offset="60%" stop-color="#ff7b00"/>
              <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#050509"/>
          <circle cx="50" cy="50" r="40" fill="url(#snakeGlow)"/>
          <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
          <path d="M30 60 Q40 40 50 50 T70 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
          <circle cx="68" cy="38" r="2" fill="#ffffff"/>
        </svg>
      </div>
      <div class="card-title">Snake</div>
      <div class="card-sub">Swipe or arrows</div>
    </div>

    <!-- Flappy -->
    <div class="card" onclick="openGame('flappy.html')">
      <div class="icon-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="flappyGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb366"/>
              <stop offset="60%" stop-color="#ff7b00"/>
              <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#050509"/>
          <circle cx="50" cy="50" r="40" fill="url(#flappyGlow)"/>
          <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
          <path d="M30 55 Q40 35 60 40 Q70 43 65 50 Q60 57 50 55 Z" fill="#ffffff"/>
          <circle cx="56" cy="44" r="2" fill="#050509"/>
        </svg>
      </div>
      <div class="card-title">Flappy Bird</div>
      <div class="card-sub">Tap to flap</div>
    </div>

    <!-- Dodge -->
    <div class="card" onclick="openGame('dodge.html')">
      <div class="icon-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="dodgeGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb366"/>
              <stop offset="60%" stop-color="#ff7b00"/>
              <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#050509"/>
          <circle cx="50" cy="50" r="40" fill="url(#dodgeGlow)"/>
          <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
          <rect x="30" y="60" width="18" height="10" fill="#ffffff"/>
          <rect x="55" y="30" width="12" height="12" fill="#ffffff"/>
          <line x1="61" y1="42" x2="61" y2="55" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>
        </svg>
      </div>
      <div class="card-title">Dodge</div>
      <div class="card-sub">Avoid the block</div>
    </div>

    <!-- 2048 -->
    <div class="card" onclick="openGame('2048.html')">
      <div class="icon-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="g2048Glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb366"/>
              <stop offset="60%" stop-color="#ff7b00"/>
              <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#050509"/>
          <circle cx="50" cy="50" r="40" fill="url(#g2048Glow)"/>
          <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
          <rect x="30" y="35" width="40" height="30" rx="6" fill="#ff9a2b"/>
          <text x="50" y="55" text-anchor="middle" fill="#ffffff" font-size="16" font-family="system-ui">2048</text>
        </svg>
      </div>
      <div class="card-title">2048</div>
      <div class="card-sub">Swipe or arrows</div>
    </div>

    <!-- Coin -->
    <div class="card" onclick="openGame('coin.html')">
      <div class="icon-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb366"/>
              <stop offset="60%" stop-color="#ff7b00"/>
              <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#050509"/>
          <circle cx="50" cy="50" r="40" fill="url(#coinGlow)"/>
          <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
          <circle cx="50" cy="50" r="16" fill="#ffcc4d" stroke="#ffe38a" stroke-width="2"/>
          <circle cx="50" cy="50" r="10" fill="#ffb700"/>
        </svg>
      </div>
      <div class="card-title">Click the Coin</div>
      <div class="card-sub">Tap fast for score</div>
    </div>

    <!-- Guess -->
    <div class="card" onclick="openGame('guess.html')">
      <div class="icon-wrap">
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="guessGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb366"/>
              <stop offset="60%" stop-color="#ff7b00"/>
              <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#050509"/>
          <circle cx="50" cy="50" r="40" fill="url(#guessGlow)"/>
          <circle cx="50" cy="50" r="32" fill="#050509" stroke="#ff9a2b" stroke-width="3"/>
          <text x="50" y="56" text-anchor="middle" fill="#ffffff" font-size="30" font-family="system-ui">?</text>
        </svg>
      </div>
      <div class="card-title">Number Guessing</div>
      <div class="card-sub">1 to 10</div>
    </div>
  </div>

  <script>
    function openGame(path) {
      window.open(path, "kryptonPopup", "width=480,height=720,menubar=no,toolbar=no,location=no,status=no");
    }
  </script>
</body>
</html>
