  <input id="satInput" type="text" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:none;background:#111827;color:#fff;">

<script>
let WORKER = "https://cryptoconverter.shadownetcg-f2f.workers.dev";

let prices = {
  btc: 0, eth: 0, sol: 0, doge: 0, ltc: 0, wax: 0, tlm: 0
};

let pricesLoaded = false;
let lock = false;
let usdClean = 0;
let activeField = null;

// --- fetch from KV-backed Worker ---
async function loadPrice(id) {
  const r = await fetch(`${WORKER}/price?coin=${id}`);
  const data = await r.json();
  if (!data[id] || typeof data[id].usd !== "number") {
    throw new Error("No price in KV for " + id);
  }
  return data[id].usd;
}

async function fetchPrices() {
  try {
    const [
      btcP, ethP, solP, 
      dogeP, ltcP, waxP, tlmP
    ] = await Promise.all([
      loadPrice("bitcoin"),
      loadPrice("ethereum"),
      loadPrice("solana"),
      loadPrice("dogecoin"),
      loadPrice("litecoin"),
      loadPrice("wax"),
      loadPrice("alien-worlds")
    ]);

    prices.btc   = btcP;
    prices.eth   = ethP;
    prices.sol   = solP;
    prices.doge  = dogeP;
    prices.ltc   = ltcP;
    prices.wax   = waxP;
    prices.tlm   = tlmP;

    pricesLoaded = true;

    document.getElementById("priceInfo").innerText =
      `BTC $${prices.btc} | ETH $${prices.eth} | SOL $${prices.sol} | ` +
      `DOGE $${prices.doge} | LTC $${prices.ltc} | ` +
      `WAX $${prices.wax} | TLM $${prices.tlm}`;
  } catch (e) {
    document.getElementById("priceInfo").innerText = "Price load failed (KV empty or Worker error)";
  }
}

fetchPrices();
setInterval(fetchPrices, 5 * 60 * 1000);

// --- inputs ---
const btc   = document.getElementById("btcInput");
const sat   = document.getElementById("satInput");
const eth   = document.getElementById("ethInput");
const sol   = document.getElementById("solInput");
const doge  = document.getElementById("dogeInput");
const ltc   = document.getElementById("ltcInput");
const wax   = document.getElementById("waxInput");
const tlm   = document.getElementById("tlmInput");
const usd   = document.getElementById("usdInput");

// Track active field
[btc, sat, eth, sol, doge, ltc, wax, tlm, usd].forEach((el) => {
  el.onfocus = () => activeField = el.id;
  el.onblur  = () => activeField = null;
});

function updateAllFromUSD(u) {
  if (!pricesLoaded) return;

  usdClean = u;

  if (activeField !== "usdInput") {
    usd.value = usdClean.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  if (activeField !== "btcInput")   btc.value   = (u / prices.btc).toFixed(8);
  if (activeField !== "satInput")   sat.value   = Math.round((u / prices.btc) * 100000000);
  if (activeField !== "ethInput")   eth.value   = (u / prices.eth).toFixed(6);
  if (activeField !== "solInput")   sol.value   = (u / prices.sol).toFixed(6);
  if (activeField !== "dogeInput")  doge.value  = (u / prices.doge).toFixed(6);
  if (activeField !== "ltcInput")   ltc.value   = (u / prices.ltc).toFixed(6);
  if (activeField !== "waxInput")   wax.value   = (u / prices.wax).toFixed(6);
  if (activeField !== "tlmInput")   tlm.value   = (u / prices.tlm).toFixed(6);
}

function convert(handler) {
  if (!pricesLoaded) return;
  if (lock) return;
  lock = true;
  handler();
  lock = false;
}

// --- crypto inputs ---
btc.oninput   = () => convert(() => updateAllFromUSD((parseFloat(btc.value)   || 0) * prices.btc));
sat.oninput   = () => convert(() => updateAllFromUSD((parseFloat(sat.value)   || 0) / 100000000 * prices.btc));
eth.oninput   = () => convert(() => updateAllFromUSD((parseFloat(eth.value)   || 0) * prices.eth));
sol.oninput   = () => convert(() => updateAllFromUSD((parseFloat(sol.value)   || 0) * prices.sol));
doge.oninput  = () => convert(() => updateAllFromUSD((parseFloat(doge.value)  || 0) * prices.doge));
ltc.oninput   = () => convert(() => updateAllFromUSD((parseFloat(ltc.value)   || 0) * prices.ltc));
wax.oninput   = () => convert(() => updateAllFromUSD((parseFloat(wax.value)   || 0) * prices.wax));
tlm.oninput   = () => convert(() => updateAllFromUSD((parseFloat(tlm.value)   || 0) * prices.tlm));

// --- USD input ---
usd.oninput = () => convert(() => {
  let raw = usd.value.replace(/,/g, "");
  let num = parseFloat(raw) || 0;
  usdClean = num;
  updateAllFromUSD(num);
});
</script>

<script>
/* ============================
      OPEN GAME
============================ */
function openGame(path, gameName) {
  document.getElementById("gameGrid").style.display = "none";
  document.getElementById("gameContainer").style.display = "flex";
  document.getElementById("gameFrame").src = path;

  // Hide Krypton Arcade header + description
  document.getElementById("arcadeTitle").style.display = "none";
  document.getElementById("arcadeDesc").style.display = "none";
  document.getElementById("faucetFrame").style.display = "none";



  // Show leaderboard + comments if game has one
  if (gameName) {
    window.currentGameId = gameName; 
    loadLeaderboard(gameName);
    loadComments(gameName);

    document.getElementById("leaderboardBox").style.display = "block";
    document.getElementById("commentsSection").style.display = "block";
  } else {
    document.getElementById("leaderboardBox").style.display = "none";
    document.getElementById("commentsSection").style.display = "none";
  }

  // Show name popup if not set
  if (!localStorage.getItem("playerNameSet")) {
    document.getElementById("namePopup").style.display = "flex";
  }
}

function openFarm(url) {
  window.location.href = url;
}


/* ============================
      CLOSE GAME
============================ */
function closeGame() {
  document.getElementById("gameFrame").src = "";
  document.getElementById("gameContainer").style.display = "none";
  document.getElementById("gameGrid").style.display = "grid";

  document.getElementById("leaderboardBox").style.display = "none";
  document.getElementById("commentsSection").style.display = "none";

  document.getElementById("arcadeTitle").style.display = "block";
  document.getElementById("arcadeDesc").style.display = "block";
  document.getElementById("arcadeDesc").style.display = "block";
}

/* ============================
      PLAYER ID (ALWAYS)
============================ */
if (!localStorage.getItem("playerID")) {
  const id = "player_" + Math.random().toString(16).slice(2, 8).toUpperCase();
  localStorage.setItem("playerID", id);
}

/* ============================
      SAVE PLAYER NAME
============================ */
function savePlayerName() {
  const name = document.getElementById("playerNameInput").value.trim();

  if (name !== "") {
    localStorage.setItem("playerName", name);
    localStorage.setItem("playerNameSet", "true");
    document.getElementById("namePopup").style.display = "none";
  }
}

/* ============================
      API ENDPOINT
============================ */
const API = "https://leaderboard.shadownetcg-f2f.workers.dev";

/* ============================
      LOAD LEADERBOARD
============================ */
async function loadLeaderboard(game) {
  const box = document.getElementById("leaderboardBox");

  let html = `<h3>${game.toUpperCase()} LEADERBOARD</h3>`;

  try {
    const res = await fetch(`${API}/leaderboard?game=${game}`);
    let board = await res.json();

    if (!board.length) {
      html += "<p>No scores yet.</p>";
    } else {
      board.sort((a, b) => b.score - a.score);

      board.forEach((entry, i) => {
        html += `<div>${i + 1}. ${entry.name.slice(0, 20)} — ${entry.score}</div>`;
      });
    }
  } catch (err) {
    html += "<p>Failed to load leaderboard.</p>";
  }

  html += `
    <button onclick="resetScores('${game}')"
      style="margin-top:12px; width:100%; padding:6px; border-radius:6px;
             background:#d62828; color:white; border:1px solid #ff9a2b;">
      Reset Scoreboard
    </button>
  `;

  html += `
    <button onclick="resetPlayerName()"
      style="margin-top:10px; width:100%; padding:6px; border-radius:6px;
             background:#ff7b00; color:#050509; border:1px solid #ff9a2b;">
      Reset Player Name
    </button>
  `;

  box.innerHTML = html;
}

/* ============================
      RESET LEADERBOARD
============================ */
async function resetScores(game) {
  const pass = prompt("Enter admin password:");
  if (pass !== "Fl@shAdmin197") {
    alert("Incorrect password.");
    return;
  }

  await fetch(`${API}/reset?game=${game}`, { method: "POST" });

  alert(`${game.toUpperCase()} leaderboard reset.`);
  loadLeaderboard(game);
}

/* ============================
      RESET PLAYER NAME
============================ */
function resetPlayerName() {
  localStorage.removeItem("playerName");
  localStorage.removeItem("playerNameSet");
  alert("Your name has been reset. Reload the page to enter a new one.");
}

/* ============================
      LOAD COMMENTS
============================ */
async function loadComments(game) {
  const list = document.getElementById("commentsList");
  list.innerHTML = "<p>Loading comments...</p>";

  try {
    const res = await fetch(`${API}/comment/load?game=${game}`);
    const comments = await res.json();

    list.innerHTML = "";

    if (!comments.length) {
      list.innerHTML = "<p>No comments yet.</p>";
      return;
    }

    comments.forEach(c => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `<strong>${c.name}</strong>: ${c.text}`;
      list.appendChild(div);
    });

  } catch (err) {
    list.innerHTML = "<p>Failed to load comments.</p>";
  }
}

/* ============================
      SUBMIT COMMENT
============================ */
document.getElementById("commentSubmit").onclick = async () => {
  const text = document.getElementById("commentInput").value.trim();
  if (!text) return;

  const name = localStorage.getItem("playerName") || "Anonymous";
  const game = window.currentGameId;

  await fetch(`${API}/comment/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game, name, text })
  });

  document.getElementById("commentInput").value = "";
  loadComments(game);
};

/* ============================
      REFRESH ADS
============================ */
setInterval(() => {
  const ad = document.querySelector("#frame iframe");
  if (ad) ad.src = ad.src;
}, 90000);


function resizeIframe() {
  const frame = document.getElementById("gameFrame");
  if (!frame) return;

  const doc = frame.contentDocument || frame.contentWindow.document;
  if (!doc) return;

  const height = doc.documentElement.scrollHeight;
  frame.style.height = height + "px";
}

// Resize when iframe loads
document.getElementById("gameFrame").addEventListener("load", () => {
  const frame = document.getElementById("gameFrame");
  const doc = frame.contentDocument || frame.contentWindow.document;

  // Initial resize
  setTimeout(resizeIframe, 100);

  // ⭐ Watch for content changes inside the iframe
  const observer = new MutationObserver(() => resizeIframe());
  observer.observe(doc.body, { childList: true, subtree: true, attributes: true });
});

// Resize on window resize
window.addEventListener("resize", resizeIframe);

window.addEventListener("message", (event) => {
  if (event.data.type === "resize-iframe") {
    const frame = document.getElementById("gameFrame");
    frame.style.height = event.data.height + "px";
  }
});

async function loadVisitorStats() {
  try {
    const res = await fetch("https://visitorstats.shadownetcg-f2f.workers.dev");
    const data = await res.json();

    document.getElementById("visitorStats").textContent =
      `Visitors today: ${data.unique} | Total visits: ${data.total}`;
  } catch (err) {
    document.getElementById("visitorStats").textContent =
      "Failed to load visitor stats.";
  }
}
loadVisitorStats();
setInterval(loadVisitorStats, 300000); // refresh every 5 minutes

const uid = new URLSearchParams(window.location.search).get("uid");

if (uid) {

} else {
  document.getElementById("faucetFrame").style.display = "none";
}







</script>
