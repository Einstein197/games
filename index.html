  <link rel="icon" type="image/png" href="barn.jpg">
  <meta name="description" content="Play Krypton SimFarm Ultimate - a free farming simulator game. Plant crops, raise animals, build your farm empire!">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

     crossorigin="anonymous"></script>

  <style>
    /* ── CSS Variables ── */
    :root {
      --primary:       #4f6ef7;
      --primary-dark:  #3a56e4;
      --secondary:     #2dd4bf;
      --green:         #10b981;
      --red:           #f43f5e;
      --bg:            radial-gradient(ellipse at top left, #121c38, #050811);
      --text:          #eef2ff;
      --text-2:        #94a3b8;
      --text-3:        #475569;
      --glass:         rgba(255,255,255,0.05);
      --glass-border:  rgba(255,255,255,0.09);
      --radius:        20px;
      --radius-sm:     12px;
      --sidebar-w:     240px;
      --topbar-h:      64px;
    }

    /* ── Background Orbs ── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
    }
    .bg-orb-1 { width:50vw; height:50vw; min-width:300px; background:var(--primary); top:-10%; left:-10%; animation:float1 20s ease-in-out infinite; }
    .bg-orb-2 { width:40vw; height:40vw; min-width:250px; background:var(--secondary); bottom:0; right:-10%; animation:float2 25s ease-in-out infinite; }
    .bg-orb-3 { width:30vw; height:30vw; min-width:200px; background:var(--primary-dark); top:40%; left:50%; animation:float1 30s ease-in-out infinite reverse; }
    @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(5%,-10%) scale(1.1)} 66%{transform:translate(-5%,5%) scale(0.9)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-5%,10%) scale(1.2)} 66%{transform:translate(5%,-5%) scale(0.8)} }

    /* ── Top Progress Bar ── */
    #top-progress-bar {
      position:fixed; top:0; left:0; height:3px;
      background:linear-gradient(90deg, var(--primary), var(--secondary));
      z-index:9999; width:0;
      transition:width 0.2s ease, opacity 0.3s ease;
      opacity:0; pointer-events:none;
    }

    /* ── AADS Banner Ad ── */
    #frame {
      margin-top: 10px;
      margin-bottom: 10px;
      width: 80%;
      position: relative;
      z-index: 99998;
    }
    #frame iframe {
      border: 0;
      padding: 0;
      width: 70%;
      height: 60px;
      border-radius: 12px;
      overflow: hidden;
      display: block;
      margin: auto;
    }

    /* ── App Shell ── */
    .app-shell { display:flex; height:100vh; position:relative; z-index:1; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      border-right: 1px solid var(--glass-border);
      background: rgba(8,12,24,0.7);
      backdrop-filter: blur(20px);
      position: fixed; top:0; left:0; z-index:100;
    }
    .sidebar-logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:32px; }
    .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .logo-icon svg { width:20px; height:20px; color:white; }
    .logo-name { font-size:18px; font-weight:700; background:linear-gradient(135deg,var(--text),var(--text-2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sidebar-nav { flex:0; display:flex; flex-direction:column; gap:4px; margin-bottom: 20px;}

    .nav-item {
      display: flex; align-items:center; gap:12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 14px; font-weight:500;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .nav-item svg { width:18px; height:18px; flex-shrink:0; }
    .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
    .nav-item.active { background:color-mix(in srgb, var(--primary) 15%, transparent); color:var(--text); }
    .nav-item.active svg { color:var(--primary); }

    /* ── Sidebar Footer Links ── */
    .sidebar-footer {
      border-top: 1px solid var(--glass-border);
      padding-top: 8px;
      margin-top: 0;
    }

    .sidebar-footer-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-footer-links a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-3);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .sidebar-footer-links a:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-2);
    }
    .sidebar-footer-links a svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── Main Area ── */
    .main-area { flex:1; display:flex; flex-direction:column; margin-left:var(--sidebar-w); min-height:100vh; }

    /* ── Topbar ── */
    .topbar {
      height: var(--topbar-h);
      display: flex; align-items:center; justify-content:space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(8,12,24,0.6);
      backdrop-filter: blur(20px);
      position: sticky; top:0; z-index:50; flex-shrink:0;
    }
    .topbar-left { display:flex; align-items:center; gap:16px; }
    .topbar-page-title { font-size:15px; font-weight:600; color:var(--text-2); }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .refresh-btn {
      width:34px; height:34px; border-radius:50%;
      background:var(--glass); border:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:center;
      color:var(--text-2); transition:all 0.2s;
    }
    .refresh-btn:hover { background:color-mix(in srgb, var(--primary) 15%, transparent); color:var(--primary); transform:rotate(20deg); }
    .refresh-btn svg { width:16px; height:16px; }

    /* ── Pages ── */
    .pages-wrap { flex:1; overflow-y:auto; padding:32px; }
    .pages-inner { max-width:860px; margin:0 auto; }
    .page { display:none; }
    .page.active { display:block; animation:pageIn 0.25s ease; }
    @keyframes pageIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ── Glass Card ── */
    .card {
      background: var(--glass);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    /* ── Section Header ── */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .section-title { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); }

    /* ── Building Views ── */
    .building-view {
      display: none;
      width: 100%;
      min-height: 500px;
      margin-top: 20px;
    }
    .building-view.active {
      display: block;
    }
    #farmView {
      display: block;
    }
    .building-iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--glass);
    }

    /* ── Top Bar (game controls) ── */
    #topBar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 8px 4px;
      font-size: 12px;
      background: var(--glass);
      backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
    }
    .panel {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-direction: column;
    }
    .panel select {
      background: rgba(0,0,0,0.3);
      color: var(--text);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
    }
    #topBar button {
      background: var(--glass);
      color: var(--text-2);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #topBar button:hover { background: rgba(255,255,255,0.08); color: var(--text); border-color: var(--primary); }

    .farm-container { position: relative; display: inline-block; margin: 10px auto; width: 100%; text-align: center; }

    /* ── Toast ── */
    #toast {
      position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
      background:rgba(20,26,46,0.95); backdrop-filter:blur(20px);
      border:1px solid var(--glass-border); border-radius:12px;
      padding:12px 20px; font-size:13px; font-weight:500;
      z-index:300; white-space:nowrap;
      opacity:0; transition:opacity 0.2s, transform 0.2s;
      transform:translateX(-50%) translateY(10px);
      pointer-events:none;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.success { border-color:rgba(16,185,129,0.4); color:var(--green); }
    #toast.error   { border-color:rgba(244,63,94,0.4);  color:var(--red); }
    #toast.info    { border-color:rgba(79,110,247,0.4);  color:var(--primary); }

    /* ── Popup ── */
    .popup {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .hidden { display: none; }
    .popupBox {
      width: 320px;
      background: #141824;
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(79,110,247,.4);
      animation: popupAnim .25s ease;
    }
    .popupBox h2 { margin-top: 0; color: var(--primary); letter-spacing: .08em; }
    .popupBox button { margin-top: 18px; width: 120px; padding: 10px; font-size: 14px; background: var(--primary); color: white; border-radius: var(--radius-sm); transition: background 0.2s; }
    .popupBox button:hover { background: var(--primary-dark); }
    @keyframes popupAnim { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ── Message ── */
    #msg { height: 18px; font-size: 12px; padding: 5px; text-align: center; color: var(--text-2); }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      .sidebar { display: none; }
      .main-area { margin-left: 0; }
      .bottom-nav { display: block; }
      .topbar { padding: 0 12px; height: 56px; }
      .topbar-page-title { font-size: 13px; }
      .pages-wrap { padding: 16px 12px 80px; }
      .pages-inner { max-width: 100%; }
      .building-iframe { height: 400px; }
      #topBar button { font-size: 9px; padding: 2px 6px; }
      .panel { font-size: 10px; padding: 3px 6px; }
      .panel select { font-size: 10px; }
    }
    @media (min-width: 768px) {
      .bottom-nav { display: none; }
    }
    @media (max-width: 480px) {
      .building-iframe { height: 350px; }
    }
  </style>
</head>

  <script>
    // ── Toast notification ──
    var toastTimer = null;
    function toast(msg, type) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.className = 'show ' + (type || 'info');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.className = ''; }, 3000);
    }

    // ── Top progress bar ──
    function setProgress(val) {
      var el = document.getElementById('top-progress-bar');
      if (!el) return;
      if (val === 0) { el.style.opacity='1'; el.style.width='0%'; }
      else if (val >= 100) { el.style.width='100%'; setTimeout(function(){ el.style.opacity='0'; },300); }
      else { el.style.width = val + '%'; }
    }

    // ── Page navigation ──
    var currentPage = 'home';
    function navigate(name) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      var pg = document.getElementById('page-' + name);
      if (pg) pg.classList.add('active');
      currentPage = name;
      document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
      var ni = document.getElementById('snav-' + name);
      if (ni) ni.classList.add('active');
      document.querySelectorAll('.bnav-item').forEach(function(n) { n.classList.remove('active'); });
      var bi = document.getElementById('bnav-' + name);
      if (bi) bi.classList.add('active');
      var tt = document.getElementById('page-title');
      if (tt) tt.textContent = { home:'Home', settings:'Settings' }[name] || name;
    }

    // ── Theme switching ──
    function applyTheme(name) {
      var THEMES = {
        navy:   { '--primary':'#4f6ef7', '--primary-dark':'#3a56e4', '--secondary':'#2dd4bf', '--bg':'radial-gradient(ellipse at top left, #121c38, #050811)', '--text':'#eef2ff', '--text-2':'#94a3b8' },
        purple: { '--primary':'#9333ea', '--primary-dark':'#7e22ce', '--secondary':'#ec4899', '--bg':'radial-gradient(circle at top right, #2a1147, #0b0512)', '--text':'#f3e8ff', '--text-2':'#c084fc' },
        ocean:  { '--primary':'#0ea5e9', '--primary-dark':'#0284c7', '--secondary':'#14b8a6', '--bg':'radial-gradient(circle at bottom left, #0b2f44, #020d18)', '--text':'#f0f9ff', '--text-2':'#7dd3fc' },
        amoled: { '--primary':'#ffffff', '--primary-dark':'#e2e8f0', '--secondary':'#94a3b8', '--bg':'#000000', '--text':'#ffffff', '--text-2':'#94a3b8' }
      };
      var t = THEMES[name] || THEMES.navy;
      var root = document.documentElement;
      Object.keys(t).forEach(function(k) { root.style.setProperty(k, t[k]); });
      localStorage.setItem('theme', name);
      toast('Theme switched to ' + name, 'info');
    }

    function switchBuilding() {
      var building = document.getElementById('buildingSelect').value;
      
      // Hide all building views
      document.querySelectorAll('.building-view').forEach(function(view) {
        view.classList.remove('active');
      });
      
      // Show the selected building view
      var view = document.getElementById(building + 'View');
      if (view) {
        view.classList.add('active');
      }
      
      // Show/hide farm
      var farmView = document.getElementById('farmView');
      if (farmView) {
        if (building === 'farm') {
          farmView.style.display = 'block';
        } else {
          farmView.style.display = 'none';
        }
      }
      
      // Update dropdown
      document.getElementById('buildingSelect').value = building;
    }

    // ── Format numbers ──
    function formatAmt(n) { return Number(n).toLocaleString(); }

    // ──────────────────────────────────────────────────────────────────────────────
    // GAME CODE - Now only handles main page state and communication
    // ──────────────────────────────────────────────────────────────────────────────

    const SAVE_KEY = "krypton_simfarm_ultimate";

    function now() { return Math.floor(Date.now() / 1000); }

    let state = {
      coins: 100,
      xp: 0,
      level: 1
    };

    function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

    function load() {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      try {
        var data = JSON.parse(raw);
        state = Object.assign(state, data);
      } catch (e) { console.error("Load error:", e); }
    }

    function render() {
      document.getElementById('coins').textContent = Math.floor(state.coins);
      document.getElementById('level').textContent = state.level;
      document.getElementById('xp').textContent = state.xp;
      document.getElementById('xpNext').textContent = state.level * 10000;
    }

    // ── Seed Select Functions ──
    function initSeedSelect() {
      var seedSelect = document.getElementById('seedSelect');
      if (!seedSelect) return;
      seedSelect.innerHTML = '';
      // Use CROPS from crops.js
      if (typeof CROPS !== 'undefined') {
        CROPS.filter(function(crop) { 
          return state.level >= crop.levelRequired; 
        }).forEach(function(crop) {
          var opt = document.createElement('option');
          opt.value = crop.id;
          opt.textContent = crop.emoji + ' ' + crop.name + ' (' + crop.baseCost + ')';
          seedSelect.appendChild(opt);
        });
      }
    }

    function syncSeedToFarm() {
      var seedSelect = document.getElementById('seedSelect');
      if (!seedSelect) return;
      var iframe = document.getElementById('farmIframe');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ 
          type: 'seed-update', 
          seed: seedSelect.value 
        }, '*');
        console.log('🌱 Seed synced to farm:', seedSelect.value);
      }
    }

    // ── Initialize ──
    load();
    render();
    initSeedSelect();

    // Restore theme
    var savedTheme = localStorage.getItem('theme');
    if (savedTheme) applyTheme(savedTheme);

    // Navigate to home
    navigate('home');

    // ── Faucet (restored) ──
    var params = new URLSearchParams(window.location.search);
    var userId = params.get("uid");
    var faucetFrame = document.getElementById("faucetFrame");
    if (userId) {
      faucetFrame.style.display = "block";
      faucetFrame.src = "faucet.html?uid=" + encodeURIComponent(userId);
    }
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "faucet-complete") {
        document.getElementById("faucetFrame").style.display = "none";
        state.coins += 100;
        save();
        render();
        toast("🎁 +100 coins!", "success");
        setTimeout(function() {
          window.location.href = "https://kryptonlegend.fun";
        }, 3000);
      }
    });

    // ── Message handling from iframes ──
    window.addEventListener('message', function(event) {
      // Handle coin updates from child iframes
      if (event.data && event.data.type === 'coin-update') {
        state.coins = event.data.coins;
        save();
        render();
        console.log('💰 Coins updated from child:', state.coins);
      }
      
      // Handle barn sell
      if (event.data && event.data.type === 'barn-sell') {
        state.coins += event.data.coins;
        save();
        render();
        toast('💰 +' + event.data.coins + ' coins from Barn!', 'success');
      }
      
      // Handle greenhouse harvest
      if (event.data && event.data.type === 'greenhouse-harvest') {
        console.log('🌿 Greenhouse harvest:', event.data.count);
      }
      
      // Handle greenhouse sell
      if (event.data && event.data.type === 'greenhouse-sell') {
        state.coins += event.data.coins;
        save();
        render();
        toast('💰 +' + event.data.coins + ' coins from Greenhouse!', 'success');
      }
      
      // Handle greenhouse upgrade
      if (event.data && event.data.type === 'greenhouse-upgrade') {
        if (state.coins >= event.data.cost) {
          state.coins -= event.data.cost;
          save();
          render();
          // Send back to greenhouse that upgrade is approved
          var iframe = document.getElementById('greenhouseFrame');
          if (iframe) {
            iframe.contentWindow.postMessage({ 
              type: 'greenhouse-upgrade-approved'
            }, '*');
          }
          toast('⬆️ Greenhouse upgraded!', 'success');
        } else {
          toast('❌ Not enough coins for greenhouse upgrade!', 'error');
        }
      }
      
      // Handle resize requests from iframes
      if (event.data && event.data.type === 'resize-iframe') {
        const iframe = document.getElementById('greenhouseFrame');
        if (iframe) {
          iframe.style.height = event.data.height + 'px';
        }
      }
      
      // Handle level up from farm
      if (event.data && event.data.type === 'level-up') {
        state.level = event.data.level;
        state.xp = event.data.xp;
        save();
        render();
        initSeedSelect();
        toast('⭐ Level up! Level ' + state.level + '!', 'success');
      }
    });

    // ── Revive function (now sends to farm iframe) ──
    function reviveAllWithAd() {
      var frame = document.getElementById("rewardedFrame");
      frame.style.display = "block";
      toast("📺 Watch ad...", "info");
      setTimeout(function() {
        frame.style.display = "none";
        // Send revive command to farm iframe
        var iframe = document.getElementById('farmIframe');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'revive-crops' }, '*');
        }
        toast("✨ Crops revived!", "success");
      }, 8000);
    }

    function resetTutorial() {
      // Send reset tutorial to farm iframe
      var iframe = document.getElementById('farmIframe');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'reset-tutorial' }, '*');
      }
      toast("📖 Tutorial reset!", "info");
    }

    function resetGame() {
      if (confirm("⚠️ Reset ALL game progress? This cannot be undone!")) {
        // Clear all game data
        localStorage.removeItem("krypton_simfarm_ultimate");
        localStorage.removeItem("krypton_simfarm_ultimate_farm");
        localStorage.removeItem("krypton_simfarm_ultimate_barn");
        localStorage.removeItem("krypton_simfarm_ultimate_greenhouse");
        localStorage.removeItem("krypton_simfarm_ultimate_feedmill");
        localStorage.removeItem("tutorial_done");
        localStorage.removeItem("tutorial_completed");
        localStorage.removeItem("tutorial_skipped");
        localStorage.removeItem("krypton_tutorial_seen");
        localStorage.removeItem("krypton_tutorial_seen_v2");
        localStorage.removeItem("krypton_tutorial_seen_farm");
        
        toast("🔄 Game reset! Reloading...", "info");
        
        // Reload after 1 second
        setTimeout(function() {
          location.reload();
        }, 1000);
      }
    }
  </script>
</body>
</html>
